<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Báo Cáo TikTok – LOHO HOUSE</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap');

:root{
  --bg:#FAF7F2; --surface:#FFFFFF; --surface2:#F5EFE6; --border:#E8DECE;
  --brown:#3D2B1F; --brown2:#6B4C35; --accent:#C4956A; --accent2:#E8C4A0;
  --green:#5C8A6B; --red:#C0614B; --amber:#B7791F;
  --text:#2C1F14; --text2:#7A6555; --text3:#B09A86;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Be Vietnam Pro',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}

/* HEADER */
.header{background:linear-gradient(135deg,#3D2B1F 0%,#6B4C35 60%,#C4956A 100%);
  padding:40px 48px 36px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px}
.header-left h1{font-size:28px;font-weight:700;color:#FAF7F2;letter-spacing:-.5px}
.header-left .sub{font-size:13px;color:#D4B896;margin-top:4px}
.header-right{text-align:right}
.header-right .week{font-size:13px;color:#FFF6EA;font-weight:600;letter-spacing:.5px;
  text-shadow:0 1px 3px rgba(61,43,31,.45)}
.header-right .generated{font-size:11px;color:#F2E2CF;margin-top:2px;
  text-shadow:0 1px 3px rgba(61,43,31,.4)}
.logo-pill{display:inline-block;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);
  border-radius:20px;padding:4px 14px;font-size:12px;font-weight:600;color:#FAF7F2;margin-bottom:10px;letter-spacing:1px}

.container{max-width:1100px;margin:0 auto;padding:32px 32px 64px}

.section-header{display:flex;align-items:center;gap:10px;margin:36px 0 16px;padding:14px 20px;
  background:var(--brown);border-radius:12px;color:#FAF7F2}
.section-header .icon{font-size:20px}
.section-header h2{font-size:16px;font-weight:700;letter-spacing:.3px;flex:1}
.section-header .meta{font-size:11px;color:var(--accent2)}

.section-label{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--accent);margin:20px 0 12px;display:flex;align-items:center;gap:8px}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:20px 22px;position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent);border-radius:14px 14px 0 0}
.kpi-card.green::before{background:var(--green)}
.kpi-card.brown::before{background:var(--brown2)}
.kpi-card.red::before{background:var(--red)}
.kpi-label{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px}
.kpi-value{font-size:26px;font-weight:700;color:var(--brown);line-height:1.1;margin-bottom:8px}
.kpi-value span{font-size:14px;font-weight:500}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px}
.badge.up{background:#EBF5EE;color:var(--green)}
.badge.down{background:#FAEAE7;color:var(--red)}
.badge.neu{background:var(--surface2);color:var(--text2)}
.kpi-note{font-size:11px;color:var(--text3);margin-top:6px}

/* CARDS */
.chart-card,.table-card,.info-box,.assess-card,.actions-card{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:20px}
.chart-card h3,.table-card h3,.info-box h3,.assess-card h3,.actions-card h3{
  font-size:15px;font-weight:600;color:var(--brown);margin-bottom:4px}
.chart-sub,.table-sub{font-size:12px;color:var(--text3);margin-bottom:16px}
.chart-wrap{position:relative;height:240px}

table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 12px;font-size:11px;font-weight:600;color:var(--text3);
  letter-spacing:.3px;text-transform:uppercase;border-bottom:1px solid var(--border);background:var(--surface2)}
td{padding:10px 12px;font-size:13px;border-bottom:1px solid #F0E8DC;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.highlight-day td{background:#FFF8F1}

.rank{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;
  border-radius:50%;font-size:11px;font-weight:700;background:var(--surface2);color:var(--text2)}
.rank.gold{background:#FFF3CD;color:#B7791F}
.rank.silver{background:#F0F0F0;color:#718096}
.rank.bronze{background:#FEF3E8;color:#C4956A}

.video-link{color:var(--brown);text-decoration:none;font-weight:500}
.video-link:hover{color:var(--accent);text-decoration:underline}
.link-icon{font-size:10px;color:var(--text3);margin-left:3px}

.series-tag{display:inline-block;padding:2px 9px;border-radius:12px;font-size:10px;font-weight:600}
.tag-edu{background:#EBF3F7;color:#3E6B85}
.tag-series{background:#F3EEF8;color:#6B4C85}
.tag-product{background:#FDF1E7;color:#B5773C}
.tag-short{background:#EFF5EC;color:#5A7A48}
.tag-fun{background:#FBEFF2;color:#9B4A63}
.tag-brand{background:#F0F0EA;color:#6B6B55}

.product-row .tag{display:inline-block;background:var(--surface2);border:1px solid var(--border);
  border-radius:4px;padding:1px 6px;font-size:10px;font-weight:600;color:var(--brown2);margin-right:6px}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.two-col>*{margin-bottom:0}

.source-item{margin-bottom:12px}
.source-header{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.source-name{color:var(--text2);font-weight:500}
.source-pct{font-weight:700;color:var(--brown)}
.source-track{height:8px;background:var(--surface2);border-radius:6px;overflow:hidden}
.source-fill{height:100%;background:var(--accent);border-radius:6px}
.source-fill.s2{background:var(--brown2)}
.source-fill.s3{background:var(--accent2)}
.source-fill.s4{background:var(--text3)}
.note-box{margin-top:14px;padding:10px 12px;background:var(--surface2);border-radius:8px;font-size:11px;color:var(--text2)}

.demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.demo-cell{background:var(--surface2);border-radius:10px;padding:14px;text-align:center}
.demo-cell .v{font-size:22px;font-weight:700;color:var(--brown)}
.demo-cell .l{font-size:11px;color:var(--text3)}

/* LIVE */
.live-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.live-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px}
.live-badge{display:inline-block;background:var(--red);color:#fff;border-radius:20px;
  padding:3px 12px;font-size:11px;font-weight:600;margin-bottom:10px}
.live-card h4{font-size:14px;font-weight:600;color:var(--brown)}
.live-date{font-size:11px;color:var(--text3);margin:4px 0 14px}
.live-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.live-stat-item{background:var(--surface2);border-radius:8px;padding:10px;text-align:center}
.live-stat-value{font-size:16px;font-weight:700;color:var(--brown)}
.live-stat-label{font-size:10px;color:var(--text3)}
.live-highlight{display:flex;justify-content:space-between;align-items:center;
  background:var(--surface2);border-radius:10px;padding:12px 14px}
.gmv-amount{font-size:20px;font-weight:700;color:var(--brown)}
.gmv-label{font-size:10px;color:var(--text3)}

/* ASSESS + ACTIONS */
.assess-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
.assess-item{display:flex;gap:11px}
.assess-icon{font-size:20px;flex:0 0 auto}
.assess-content h5{font-size:13px;font-weight:600;color:var(--brown);margin-bottom:3px}
.assess-content p{font-size:12px;color:var(--text2);line-height:1.55}

.action-list{margin-top:14px}
.action-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #F0E8DC}
.action-item:last-child{border-bottom:none}
.action-num{flex:0 0 26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;
  font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.action-tag{display:inline-block;padding:2px 9px;border-radius:12px;font-size:10px;
  font-weight:700;letter-spacing:.5px;margin-bottom:5px}
.action-tag.video{background:#EBF3F7;color:#3E6B85}
.action-tag.live{background:#FAEAE7;color:var(--red)}
.action-tag.shop{background:#FDF1E7;color:#B5773C}
.action-tag.content{background:#EFF5EC;color:#5A7A48}
.action-content h5{font-size:13px;font-weight:600;color:var(--brown);margin-bottom:3px}
.action-content p{font-size:12px;color:var(--text2);line-height:1.55}

.footer{text-align:center;padding:24px;font-size:11px;color:var(--text3);border-top:1px solid var(--border)}

/* STATE SCREENS */
.state{max-width:640px;margin:80px auto;background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:32px}
.state h2{font-size:18px;color:var(--brown);margin-bottom:10px}
.state p{font-size:13px;color:var(--text2);margin-bottom:10px}
.state ol{margin:12px 0 12px 20px;font-size:13px;color:var(--text2)}
.state li{margin-bottom:6px}
.state input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;
  font-family:inherit;font-size:12px;margin:8px 0}
.state button{background:var(--brown);color:#FAF7F2;border:none;border-radius:8px;
  padding:10px 20px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.state button:hover{background:var(--brown2)}
.state code{background:var(--surface2);border:1px solid var(--border);border-radius:4px;
  padding:1px 5px;font-size:12px;word-break:break-all}
.spin{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:r .8s linear infinite;margin-bottom:14px}
@keyframes r{to{transform:rotate(360deg)}}

.cfg-btn{position:fixed;right:16px;bottom:16px;background:var(--brown);color:#FAF7F2;border:none;
  border-radius:20px;padding:8px 16px;font-family:inherit;font-size:12px;cursor:pointer;opacity:.55;z-index:9}
.cfg-btn:hover{opacity:1}

@media(max-width:860px){
  .kpi-grid,.kpi-grid-3{grid-template-columns:repeat(2,1fr)}
  .two-col,.live-grid,.assess-grid{grid-template-columns:1fr}
  .header{padding:28px 20px}
  .container{padding:20px 16px 48px}
  .table-card,.chart-card,.info-box,.assess-card,.actions-card{padding:16px;overflow-x:auto}
}
</style>
</head>
<body>

<div id="app">
  <div class="state" style="text-align:center">
    <div class="spin" style="margin:0 auto 14px"></div>
    <h2>Đang tải số liệu từ Google Sheet…</h2>
    <p>Nếu màn hình này đứng quá 10 giây, Sheet chưa được chia sẻ công khai.</p>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   CẤU HÌNH — ID của file Sheet nhập liệu
   ═══════════════════════════════════════════════════════════ */
const SHEET_ID = '1CHDLJAjR9UaQ5wPjkF9ZBMwGTU2ifuM_GT0LXGUkypM';

function sheetUrls(){
  const saved = localStorage.getItem('loho_csv_url');
  const fromQuery = new URLSearchParams(location.search).get('csv');
  const base = 'https://docs.google.com/spreadsheets/d/'+SHEET_ID;
  const list = [];
  if (fromQuery) list.push(fromQuery);
  if (saved) list.push(saved);
  // PHẢI dùng /export?format=csv — đây là bản xuất thô, giữ nguyên mọi ô.
  // KHÔNG dùng /gviz/tq: nó tự đoán kiểu từng cột, cột nào lẫn số với chữ thì nó
  // giữ số và XOÁ HẾT CHỮ (mất "đ", mất green/red, mất THUC/UOC).
  list.push(base+'/export?format=csv');
  return list;
}

/* ── CSV PARSER (xử lý dấu nháy, xuống dòng trong ô) ── */
function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=c;
    } else {
      if(c==='"') q=true;
      else if(c===','){ row.push(cell); cell=''; }
      else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
      else if(c!=='\r') cell+=c;
    }
  }
  if(cell!=='' || row.length){ row.push(cell); rows.push(row); }
  return rows;
}

/* ── TIỆN ÍCH ── */
const esc = s => String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
// Số thuần -> thêm dấu chấm ngăn nghìn. Chữ có đơn vị -> giữ nguyên.
const fmt = v => { const s=String(v??'').trim();
  return /^-?\d+$/.test(s) ? Number(s).toLocaleString('vi-VN') : s; };
const num = v => { const s=String(v??'').trim().replace(',','.');
  const n=parseFloat(s); return isNaN(n)?0:n; };
// "1,9M đ" -> 1.9 ; "663K đ" -> 663 ; "0 đ" -> 0. Chỉ dùng để so sánh phiên LIVE nào cao nhất.
const money = s => num(String(s??'').replace(/[^0-9,.]/g,'').replace(/\.(?=\d{3}\b)/g,''));
const badgeClass = g => { const s=String(g||'').trim();
  return s.startsWith('▲')?'up' : s.startsWith('▼')?'down' : 'neu'; };
const rankClass = i => ['gold','silver','bronze'][i] || '';

const TYPE_TAG = {'hướng dẫn':'edu','educate':'edu','series':'series','sản phẩm':'product',
  'bán hàng':'product','short':'short','giải trí':'fun','branding':'brand'};
const typeTag = t => TYPE_TAG[String(t||'').toLowerCase().trim()] || 'brand';

const TRAFFIC_ICON = [[/tìm kiếm|search/i,'🔍'],[/đề xuất|fyp/i,'✨'],[/hồ sơ|profile/i,'👤'],[/follow/i,'👥']];
const trafficIcon = n => (TRAFFIC_ICON.find(([re])=>re.test(n))||[null,'📊'])[1];

const ASSESS_ICON = {TOT:'✅',TANG:'📈',CANHBAO:'⚠️',PHATHIEN:'💡',PHANTICH:'🔍',SOLIEU:'📊'};

/* ── TẢI & DỰNG ── */
async function load(){
  const urls = sheetUrls();
  let text = null, lastErr = null;
  for(const u of urls){
    try{
      const r = await fetch(u);
      if(!r.ok) throw new Error('HTTP '+r.status);
      const t = await r.text();
      if(t.trim().startsWith('<')) throw new Error('Sheet chưa công khai');
      text = t; break;
    }catch(e){ lastErr = e; }
  }
  if(text===null) return showSetup(lastErr);

  try{ render(parseCSV(text)); }
  catch(e){ showSetup(e); }
}

function showSetup(err){
  document.getElementById('app').innerHTML = `
  <div class="state">
    <h2>⚙️ Chưa đọc được Google Sheet</h2>
    <p style="color:var(--red)">Lý do: ${esc(err && err.message || 'không rõ')}</p>
    <p><b>Cách sửa — làm 1 lần duy nhất:</b></p>
    <ol>
      <li>Mở file Sheet nhập liệu.</li>
      <li>Bấm <b>Chia sẻ</b> (góc trên bên phải).</li>
      <li>Ở mục <b>Quyền truy cập chung</b>, đổi từ "Bị hạn chế" sang
          <b>Bất kỳ ai có đường liên kết</b> — vai trò <b>Người xem</b>.</li>
      <li>Bấm <b>Xong</b>, rồi tải lại trang này.</li>
    </ol>
    <p style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border)">
      <b>Cách khác</b> — nếu công ty chặn chia sẻ công khai: trong Sheet vào
      <b>Tệp → Chia sẻ → Xuất bản lên web</b>, chọn định dạng <b>.csv</b>,
      copy link rồi dán vào đây:</p>
    <input id="cfgUrl" placeholder="https://docs.google.com/spreadsheets/d/e/2PACX-.../pub?output=csv">
    <button onclick="saveUrl()">Lưu và tải lại</button>
  </div>`;
}
function saveUrl(){
  const v = document.getElementById('cfgUrl').value.trim();
  if(v) localStorage.setItem('loho_csv_url', v);
  location.reload();
}
function resetCfg(){ localStorage.removeItem('loho_csv_url'); location.reload(); }

/* ── RENDER ── */
function render(rows){
  const by = t => rows.filter(r => (r[0]||'').trim() === t);
  const meta = {}; by('META').forEach(r => meta[(r[1]||'').trim()] = (r[2]||'').trim());
  const kpi = {}; by('KPI').forEach(r => kpi[(r[1]||'').trim()] = {
    label:r[2], value:r[3], unit:r[4], color:(r[5]||'').trim(), badge:r[6], note:r[7]});
  const ghichu = {}; by('GHICHU').forEach(r => ghichu[(r[1]||'').trim()] = r[2]);

  const days = by('NGAY'), videos = by('VIDEO'), traffic = by('TRAFFIC'),
        demo = by('NHANKHAU'), gmvVideos = by('GMVVIDEO'), products = by('SANPHAM'),
        topViews = by('TOPVIEW'), lives = by('LIVE'), assess = by('DANHGIA'), actions = by('HANHDONG');

  const card = (k, extra) => { const c = kpi[k]; if(!c) return '';
    return `<div class="kpi-card ${c.color}">
      <div class="kpi-label">${esc(c.label)}</div>
      <div class="kpi-value">${esc(fmt(c.value))}${c.unit?` <span>${esc(c.unit)}</span>`:''}</div>
      <span class="badge ${badgeClass(c.badge)}">${esc(c.badge)}</span>
      <div class="kpi-note">${esc(c.note)}</div></div>`; };

  document.getElementById('app').innerHTML = `
<div class="header">
  <div class="header-left">
    <div class="logo-pill">LOHO HOUSE</div>
    <h1>Báo Cáo Hoạt Động TikTok</h1>
    <div class="sub">${esc(meta.KENH||'')} · Tổng hợp từ TikTok Studio, TikTok Shop &amp; LIVE Analytics</div>
  </div>
  <div class="header-right">
    <div class="week">TUẦN ${esc(meta.TUAN||'')}</div>
    <div class="generated">Tạo ngày ${esc(meta.NGAY_TAO||'')}</div>
  </div>
</div>

<div class="container">

  <div class="section-header" style="margin-top:0">
    <span class="icon">📊</span><h2>I. TỔNG QUAN TUẦN</h2>
    <span class="meta">Số liệu hợp nhất từ 3 nền tảng · ${esc(meta.TUAN||'')}</span>
  </div>

  <div class="section-label">Kết Quả Kinh Doanh</div>
  <div class="kpi-grid">${card('GMV_TONG')}${card('GMV_VIDEO')}${card('GMV_LIVE')}${card('FOLLOWERS')}</div>

  <div class="section-label">Hiệu Suất Nội Dung</div>
  <div class="kpi-grid">${card('VIDEO_MOI')}${card('LUOT_XEM')}${card('TUONG_TAC')}${card('CHIA_SE')}</div>

  ${days.length?`
  <div class="section-label">Doanh Thu Theo Ngày</div>
  <div class="chart-card">
    <h3>GMV Ghi Nhận Theo Ngày — Tuần ${esc(meta.TUAN||'')}</h3>
    <div class="chart-sub">Cột đậm = dữ liệu thực · Cột nhạt = ước tính từ tổng tuần</div>
    <div class="chart-wrap"><canvas id="revenueChart"></canvas></div>
  </div>`:''}

  <div class="section-header">
    <span class="icon">🎬</span><h2>II. TIKTOK STUDIO — PHÂN TÍCH NỘI DUNG</h2>
    <span class="meta">${videos.length} video mới · ${esc(meta.TUAN||'')}</span>
  </div>

  <div class="section-label">Tổng Quan Studio</div>
  <div class="kpi-grid">${card('STUDIO_VIEWS')}${card('STUDIO_THICH')}${card('STUDIO_NOIBAT')}${card('STUDIO_HOSO')}</div>

  ${videos.length?`
  <div class="section-label">Danh Sách Video Đã Đăng</div>
  <div class="table-card">
    <h3>${videos.length} Video Mới Tuần ${esc(meta.TUAN||'')}</h3>
    <div class="table-sub">Click tên video để xem trực tiếp trên TikTok · Sắp xếp theo lượt xem</div>
    <table><thead><tr><th>#</th><th>Tên Video</th><th>Loại</th><th>Ngày Đăng</th>
      <th>Lượt Xem</th><th>Thích</th><th>Bình Luận</th></tr></thead><tbody>
      ${videos.slice().sort((a,b)=>num(b[4])-num(a[4])).map((r,i)=>`
      <tr${i===0?' class="highlight-day"':''}>
        <td><span class="rank ${rankClass(i)}">${i+1}</span></td>
        <td>${r[7]?`<a class="video-link" href="${esc(r[7])}" target="_blank" rel="noopener">${i===0?'🏆 ':''}${esc(r[1])}<span class="link-icon">↗</span></a>`:esc(r[1])}</td>
        <td><span class="series-tag tag-${typeTag(r[2])}">${esc(r[2])}</span></td>
        <td>${esc(r[3])}</td><td><strong>${esc(fmt(r[4]))}</strong></td>
        <td>${esc(fmt(r[5]))}</td><td>${esc(fmt(r[6]))}</td>
      </tr>`).join('')}
    </tbody></table>
  </div>`:''}

  ${(traffic.length||demo.length)?`
  <div class="section-label">Nguồn Traffic &amp; Đặc Điểm Người Xem</div>
  <div class="two-col">
    <div class="info-box">
      <h3>📊 Nguồn Lưu Lượng Video</h3>
      <div class="source-list">${traffic.map((r,i)=>`
        <div class="source-item">
          <div class="source-header"><span class="source-name">${trafficIcon(r[1])} ${esc(r[1])}</span>
            <span class="source-pct">${String(num(r[2])).replace('.',',')}%</span></div>
          <div class="source-track"><div class="source-fill s${i+1>4?4:i+1}" style="width:${num(r[2])}%"></div></div>
        </div>`).join('')}</div>
      ${ghichu.TRAFFIC?`<div class="note-box">💡 ${esc(ghichu.TRAFFIC)}</div>`:''}
    </div>
    <div class="info-box">
      <h3>👥 Đặc Điểm Người Theo Dõi</h3>
      <div class="demo-grid">${demo.map(r=>`
        <div class="demo-cell"><div class="v">${esc(r[1])}</div><div class="l">${esc(r[2])}</div></div>`).join('')}</div>
      ${ghichu.NHANKHAU?`<div class="note-box">🕐 ${esc(ghichu.NHANKHAU)}</div>`:''}
    </div>
  </div>`:''}

  <div class="section-header">
    <span class="icon">🛒</span><h2>III. GMV — TIKTOK SHOP FOR CREATORS</h2>
    <span class="meta">Doanh thu ghi nhận · ${esc(meta.TUAN||'')}</span>
  </div>

  <div class="section-label">Tổng Quan Doanh Thu</div>
  <div class="kpi-grid-3">${card('GMV_TONG')}${card('GMV_VIDEO')}${card('GMV_LIVE')}</div>

  ${gmvVideos.length?`
  <div class="section-label">Top Video Theo Doanh Thu</div>
  <div class="table-card">
    <h3>Video Tạo Ra Nhiều Doanh Thu Nhất</h3>
    <div class="table-sub">Xếp hạng theo GMV ghi nhận · Bao gồm video cũ có đơn trong tuần này</div>
    <table><thead><tr><th>#</th><th>Tên Video</th><th>Lượt Xem</th><th>GMV</th>
      <th>Số Món</th><th>Tỉ Lệ Chuyển Đổi</th></tr></thead><tbody>
      ${gmvVideos.map((r,i)=>`
      <tr${i===0?' class="highlight-day"':''}>
        <td><span class="rank ${rankClass(i)}">${i+1}</span></td>
        <td>${i===0?'🏆 ':''}${esc(r[1])}</td>
        <td>${esc(fmt(r[2]))}</td><td><strong>${esc(r[3])}</strong></td>
        <td>${esc(fmt(r[4]))}</td><td><span class="badge ${i<4?'up':'neu'}">${esc(r[5])}</span></td>
      </tr>`).join('')}
    </tbody></table>
  </div>`:''}

  ${(products.length||topViews.length)?`
  <div class="section-label">Top Sản Phẩm &amp; Video Xem Nhiều</div>
  <div class="two-col">
    <div class="table-card">
      <h3>Top Sản Phẩm Bán Chạy</h3>
      <div class="table-sub">Theo GMV ghi nhận tuần ${esc(meta.TUAN||'')}</div>
      <table><thead><tr><th>#</th><th>Sản Phẩm</th><th>GMV</th><th>Món</th></tr></thead><tbody>
        ${products.map((r,i)=>`<tr>
          <td><span class="rank ${rankClass(i)}">${i+1}</span></td>
          <td class="product-row"><span class="tag">${esc(r[1])}</span>${esc(r[2])}</td>
          <td><strong>${esc(r[3])}</strong></td><td>${esc(fmt(r[4]))}</td></tr>`).join('')}
      </tbody></table>
    </div>
    <div class="table-card">
      <h3>Top Video — Lượt Xem Nhiều Nhất (7 Ngày)</h3>
      <div class="table-sub">Bao gồm video cũ vẫn đang được xem</div>
      <table><thead><tr><th>#</th><th>Tên Video</th><th>Lượt Xem</th></tr></thead><tbody>
        ${topViews.map((r,i)=>`<tr>
          <td><span class="rank ${rankClass(i)}">${i+1}</span></td>
          <td>${String(r[3]||'').trim()?'🆕 ':''}${esc(r[1])}</td>
          <td><strong>${esc(fmt(r[2]))}</strong></td></tr>`).join('')}
      </tbody></table>
    </div>
  </div>`:''}

  ${lives.length?`
  <div class="section-header">
    <span class="icon">📡</span><h2>IV. TIKTOK LIVE</h2>
    <span class="meta">${lives.length} phiên phát sóng</span>
  </div>

  <div class="section-label">Tổng Quan LIVE</div>
  <div class="kpi-grid">${card('LIVE_SOPHIEN')}${card('LIVE_LUOTXEM')}${card('LIVE_GMV')}${card('LIVE_SOSANH')}</div>

  <div class="section-label">Chi Tiết Từng Phiên</div>
  <div class="live-grid">${lives.map((r,i)=>{
    const best = lives.length>1 && money(r[10])>0 && lives.every(o=>money(o[10])<=money(r[10]));
    return `<div class="live-card"${best?' style="border-color:var(--accent2)"':''}>
      <div class="live-badge"${best?' style="background:#B7791F"':''}>● LIVE ${i+1}${best?' ⭐ Tốt nhất tuần':''}</div>
      <h4>${esc(r[1])}</h4>
      <div class="live-date">📅 ${esc(r[2])} · Thời lượng: ${esc(r[3])}</div>
      <div class="live-stats">
        <div class="live-stat-item"><div class="live-stat-value">${esc(fmt(r[4]))}</div><div class="live-stat-label">Lượt xem</div></div>
        <div class="live-stat-item"><div class="live-stat-value">${esc(fmt(r[5]))}</div><div class="live-stat-label">Người duy nhất</div></div>
        <div class="live-stat-item"><div class="live-stat-value">${esc(fmt(r[6]))}</div><div class="live-stat-label">PCU cao nhất</div></div>
        <div class="live-stat-item"><div class="live-stat-value">${esc(fmt(r[7]))}</div><div class="live-stat-label">Thích</div></div>
        <div class="live-stat-item"><div class="live-stat-value">${esc(fmt(r[8]))}</div><div class="live-stat-label">Bình luận</div></div>
        <div class="live-stat-item"><div class="live-stat-value">${esc(r[9])}</div><div class="live-stat-label">Xem TB</div></div>
      </div>
      <div class="live-highlight" style="margin-top:12px">
        <div><div class="gmv-amount">${esc(r[10])}</div>
          <div class="gmv-label">GMV · ${esc(fmt(r[11]))} đơn hàng</div></div>
      </div>
      <div style="margin-top:12px;font-size:11px;color:var(--text3)">
        <strong style="color:var(--text2)">Nguồn xem:</strong> ${esc(r[12])}</div>
      <div class="note-box" style="margin-top:6px">${esc(r[13])}</div>
    </div>`;}).join('')}</div>`:''}

  <div class="section-header">
    <span class="icon">🎯</span><h2>V. ĐÁNH GIÁ &amp; KẾ HOẠCH TUẦN TỚI</h2>
    <span class="meta">Điểm mạnh · Điểm yếu · Next actions ${esc(meta.TUAN_TOI||'')}</span>
  </div>

  ${assess.length?`
  <div class="section-label">Phân Tích Điểm Mạnh – Điểm Yếu</div>
  <div class="assess-card">
    <h3>🎯 Tổng Kết Tuần ${esc(meta.TUAN||'')}</h3>
    <div class="assess-grid">${assess.map(r=>`
      <div class="assess-item">
        <div class="assess-icon">${ASSESS_ICON[(r[1]||'').trim().toUpperCase()]||'📌'}</div>
        <div class="assess-content"><h5>${esc(r[2])}</h5><p>${esc(r[3])}</p></div>
      </div>`).join('')}</div>
  </div>`:''}

  ${actions.length?`
  <div class="section-label">Kế Hoạch Hành Động</div>
  <div class="actions-card">
    <h3>🚀 Next Actions — Tuần ${esc(meta.TUAN_TOI||'')}</h3>
    <div class="action-list">${actions.map((r,i)=>`
      <div class="action-item">
        <div class="action-num">${i+1}</div>
        <div class="action-content">
          <div class="action-tag ${(r[1]||'').toLowerCase().trim()}">${esc(r[1])}</div>
          <h5>${esc(r[2])}</h5><p>${esc(r[3])}</p>
        </div>
      </div>`).join('')}</div>
  </div>`:''}

</div>
<div class="footer">
  Báo cáo tổng hợp từ TikTok Studio, TikTok Shop for Creators &amp; LIVE Analytics ·
  LOHO HOUSE (${esc(meta.KENH||'')}) · Tuần ${esc(meta.TUAN||'')}
</div>
<button class="cfg-btn" onclick="resetCfg()">⚙️ Đặt lại nguồn dữ liệu</button>`;

  if(days.length) drawChart(days);
}

/* ── BIỂU ĐỒ ── */
function drawChart(days){
  const el = document.getElementById('revenueChart'); if(!el || !window.Chart) return;
  const labels = days.map(r=>r[1]);
  const dv = days.map(r=>num(r[2])), dl = days.map(r=>num(r[3]));
  const actual = days.map(r=>(r[4]||'').trim().toUpperCase()==='THUC');
  const peak = dv.map((v,i)=>v+dl[i]).reduce((m,v,i,a)=>a[m]>v?m:i,0);

  new Chart(el.getContext('2d'), {
    type:'bar',
    data:{labels,datasets:[
      {label:'GMV Video (nghìn đ)',data:dv,stack:'s',borderRadius:6,borderSkipped:false,
       backgroundColor:c=>c.dataIndex===peak?'rgba(196,149,106,.95)':actual[c.dataIndex]?'rgba(196,149,106,.75)':'rgba(196,149,106,.38)',
       borderColor:c=>c.dataIndex===peak?'#B87340':actual[c.dataIndex]?'rgba(196,149,106,.9)':'transparent',
       borderWidth:c=>actual[c.dataIndex]?2:0},
      {label:'GMV LIVE (nghìn đ)',data:dl,stack:'s',borderRadius:6,borderSkipped:false,
       backgroundColor:c=>c.dataIndex===peak?'rgba(192,97,75,.95)':actual[c.dataIndex]?'rgba(192,97,75,.6)':'rgba(192,97,75,.22)',
       borderColor:c=>c.dataIndex===peak?'#C0614B':'transparent',
       borderWidth:c=>c.dataIndex===peak?2:0}
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{
        legend:{position:'top',align:'start',labels:{font:{family:"'Be Vietnam Pro',sans-serif",size:11},
          color:'#7A6555',boxWidth:12,boxHeight:12,padding:16,usePointStyle:true,pointStyle:'rectRounded'}},
        tooltip:{backgroundColor:'#3D2B1F',padding:12,cornerRadius:8,
          titleFont:{family:"'Be Vietnam Pro',sans-serif",size:12,weight:'600'},
          bodyFont:{family:"'Be Vietnam Pro',sans-serif",size:11},
          callbacks:{label:it=>` ${it.dataset.label}: ${it.raw.toLocaleString('vi-VN')}K đ${actual[it.dataIndex]?'':' (ước tính)'}`}}
      },
      scales:{
        x:{stacked:true,grid:{display:false},ticks:{font:{family:"'Be Vietnam Pro',sans-serif",size:11},color:'#B09A86'}},
        y:{stacked:true,grid:{color:'#F0E8DC'},ticks:{font:{family:"'Be Vietnam Pro',sans-serif",size:11},
          color:'#B09A86',callback:v=>v+'K đ'}}
      }}
  });
}

load();
</script>
