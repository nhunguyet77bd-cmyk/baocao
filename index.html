<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>週報 Báo Cáo Tuần TikTok – LOHO HOUSE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap');

:root{
  --bg:#FAF7F2; --surface:#FFFFFF; --surface2:#F5EFE6; --border:#E8DECE;
  --brown:#3D2B1F; --brown2:#6B4C35; --accent:#C4956A; --accent2:#E8C4A0;
  --green:#5C8A6B; --red:#C0614B; --amber:#B7791F; --gray:#B8AC9E;
  --text:#2C1F14; --text2:#7A6555; --text3:#B09A86;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Be Vietnam Pro','Microsoft JhengHei',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-print-color-adjust:exact;print-color-adjust:exact}

/* ═══ HEADER ═══ */
.header{background:linear-gradient(135deg,#2E2013 0%,#3D2B1F 45%,#6B4C35 100%);
  padding:34px 24px 28px;text-align:center;color:#FAF7F2}
.header h1{font-size:26px;font-weight:700;letter-spacing:-.3px}
.header h1 .gold{color:#D4B896}
.header .sub{font-size:13px;color:#D4B896;margin-top:6px}
.header .sub b{color:#FFF6EA}

/* ═══ BỘ LỌC THÁNG → TUẦN ═══ */
.filterbar{background:var(--surface);border-bottom:1px solid var(--border);padding:18px 16px 16px;text-align:center;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(61,43,31,.05)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips + .chips{margin-top:10px}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--text2);
  border-radius:24px;padding:7px 18px;font-size:13px;font-weight:600;cursor:pointer;
  font-family:inherit;transition:.15s}
.chip:hover:not(:disabled){border-color:var(--accent);color:var(--brown)}
.chip.on{background:var(--brown2);border-color:var(--brown2);color:#FFF6EA}
.chip.on.wk{background:var(--accent);border-color:var(--accent);color:#3D2B1F}
.chip:disabled{opacity:.35;cursor:not-allowed}
.chip.wk{font-size:12px;padding:6px 14px}
.filternote{font-size:11px;color:var(--text3);margin-top:10px}

/* ═══ TOOLBAR ═══ */
.toolbar{max-width:1100px;margin:14px auto 0;padding:0 24px;display:flex;gap:8px;justify-content:flex-end}
.tbtn{border:1px solid var(--border);background:var(--surface);color:var(--text2);border-radius:8px;
  padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.tbtn:hover{border-color:var(--accent);color:var(--brown)}
.tbtn.active{background:var(--amber);border-color:var(--amber);color:#fff}

.container{max-width:1100px;margin:0 auto;padding:10px 24px 64px}

/* ═══ BANNER ═══ */
.banner{background:#FFF4E0;border:1px solid #EAD199;border-radius:12px;padding:12px 18px;
  font-size:13px;color:#8A6516;margin:16px 0 4px}
.banner.edited{background:#FDECE7;border-color:#EBC2B5;color:#93412D}
.banner button{margin-left:10px;border:1px solid currentColor;background:transparent;color:inherit;
  border-radius:6px;padding:2px 10px;font-size:12px;cursor:pointer;font-family:inherit}

/* ═══ SECTION ═══ */
.sec{display:flex;align-items:baseline;gap:10px;margin:38px 0 6px;border-bottom:2px solid var(--accent);padding-bottom:8px}
.sec .num{font-size:20px;color:var(--brown2);font-weight:700}
.sec h2{font-size:19px;font-weight:700;color:var(--brown)}
.sec h2 .zh{color:var(--brown2);margin-right:6px;font-weight:600}
.sec .star{font-size:13px;color:var(--amber)}
.secnote{font-size:12px;color:var(--text3);margin:2px 0 14px}

.empty{color:var(--text3);font-size:13px;font-style:italic;padding:14px 4px}

/* ═══ KPI ═══ */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-top:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px}
.kpi .lb{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.kpi .lb .zh{color:var(--accent)}
.kpi .val{font-size:25px;font-weight:700;color:var(--brown);margin:6px 0 4px;line-height:1.1}
.kpi .val span{font-size:13px;font-weight:500;color:var(--text2)}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px}
.badge.up{background:#EBF5EE;color:var(--green)}
.badge.down{background:#FAEAE7;color:var(--red)}
.badge.neu{background:var(--surface2);color:var(--text2)}

/* ═══ TABLE ═══ */
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
th{background:var(--surface2);color:var(--brown2);font-size:11px;text-transform:uppercase;
  letter-spacing:.5px;font-weight:700;padding:11px 14px;text-align:left;white-space:nowrap}
td{padding:11px 14px;border-top:1px solid var(--border);vertical-align:top}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
tr:hover td{background:#FBF8F3}
.vidname{font-weight:600;color:var(--brown);max-width:340px}
.small{font-size:12px;color:var(--text2)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 10px;border-radius:12px;background:var(--surface2);color:var(--brown2);white-space:nowrap}
.tag.ads{background:#FAEAE7;color:var(--red)}
.tag.org{background:#EBF5EE;color:var(--green)}
.tag.gold{background:#F7EDD8;color:var(--amber)}

/* trạng thái clip */
.st{display:inline-block;font-size:12px;font-weight:600;padding:3px 12px;border-radius:14px;white-space:nowrap}
.st.dadang{background:#EBF5EE;color:var(--green)}
.st.choedit{background:#FFF4E0;color:var(--amber)}
.st.chuaquay{background:#F0EBFA;color:#6B5A9E}
.st.ytuong{background:var(--surface2);color:var(--text2)}
.st.boqua{background:#FAEAE7;color:var(--red)}

/* thanh % trong bảng */
.bar{height:7px;border-radius:5px;background:var(--surface2);margin-top:5px;min-width:90px}
.bar i{display:block;height:100%;border-radius:5px;background:var(--accent)}

/* ═══ DONUT ads/organic ═══ */
.split{display:grid;grid-template-columns:280px 1fr;gap:18px;margin-top:12px;align-items:start}
@media(max-width:760px){.split{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px}
.donutwrap{text-align:center}
.donut{width:170px;height:170px;border-radius:50%;margin:8px auto;position:relative}
.donut::after{content:'';position:absolute;inset:34px;background:var(--surface);border-radius:50%}
.donut .mid{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:2}
.donut .mid b{font-size:20px;color:var(--brown)}
.donut .mid span{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.leg{display:flex;flex-direction:column;gap:8px;margin-top:12px;text-align:left}
.leg .row{display:flex;align-items:center;gap:8px;font-size:13px}
.leg .dot{width:11px;height:11px;border-radius:3px;flex:none}
.leg b{margin-left:auto}

/* ═══ TOP CARDS ═══ */
.tops{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
@media(max-width:760px){.tops{grid-template-columns:1fr}}
.topcard{background:linear-gradient(135deg,#FFFDF9,#F7F0E4);border:1px solid var(--accent2);border-radius:14px;padding:18px 20px}
.topcard .lb{font-size:11px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:1px}
.topcard .name{font-size:15px;font-weight:700;color:var(--brown);margin:6px 0 2px}
.topcard .num{font-size:22px;font-weight:700;color:var(--brown2)}
.topcard .num span{font-size:13px;font-weight:500;color:var(--text2)}

/* ═══ NHẬN XÉT / KẾ HOẠCH ═══ */
.bullets{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:8px 20px;margin-top:12px}
.bullets .b{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--surface2);font-size:13.5px}
.bullets .b:last-child{border-bottom:0}
.bullets .ic{flex:none}

/* ═══ DỰ ÁN RIÊNG ═══ */
.projbox{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-top:12px}
.projbox select{font-family:inherit;font-size:14px;font-weight:600;color:var(--brown);
  border:1px solid var(--border);border-radius:10px;padding:9px 14px;background:var(--surface2);min-width:260px;max-width:100%}
.projgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
@media(max-width:760px){.projgrid{grid-template-columns:1fr}}
.projcell{background:var(--surface2);border-radius:12px;padding:14px 16px}
.projcell h4{font-size:12px;color:var(--brown2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.projcell ul{list-style:none}
.projcell li{font-size:13px;padding:3px 0 3px 2px}
.projcell.full{grid-column:1/-1}
.progressbig{height:12px;border-radius:8px;background:#E8DECE;overflow:hidden;margin-top:6px}
.progressbig i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--brown2))}

/* ═══ TIẾN ĐỘ SX summary ═══ */
.pipestats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0 4px}
.pipestat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;text-align:center}
.pipestat b{font-size:22px;color:var(--brown);display:block}
.pipestat span{font-size:11px;color:var(--text2)}

.footer{text-align:center;font-size:11px;color:var(--text3);padding:30px 0 14px}

/* ═══ SETUP SCREEN ═══ */
.state{max-width:620px;margin:60px auto;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px}
.state h2{color:var(--brown);margin-bottom:12px}
.state ol{margin:10px 0 10px 20px}
.state li{margin:6px 0}
.state input{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-family:inherit;font-size:13px;margin:10px 0}
.state button{background:var(--brown2);color:#fff;border:0;border-radius:8px;padding:10px 20px;font-family:inherit;font-weight:600;cursor:pointer}

/* ═══ IN ẤN ═══ */
@media print{
  .filterbar,.toolbar,.banner button{display:none!important}
  .header{padding:20px}
  body{font-size:12px}
  .sec{break-after:avoid}
  .tblwrap,.card,.bullets,.projbox{break-inside:avoid}
}
[contenteditable="true"]{outline:1px dashed var(--amber);outline-offset:2px}
</style>
</head>
<body>

<div class="header">
  <h1><span class="gold">LOHO</span> House <span class="gold">TikTok 內容週報</span> Báo Cáo Tuần TikTok</h1>
  <div class="sub" id="hsub">Đang tải dữ liệu…</div>
</div>

<div class="filterbar" id="filterbar" style="display:none">
  <div class="chips" id="monthChips"></div>
  <div class="chips" id="weekChips"></div>
  <div class="filternote">Chọn <b>tháng</b> rồi chọn <b>tuần</b> — tuần chưa có số liệu sẽ bị mờ</div>
</div>

<div class="toolbar" id="toolbar" style="display:none">
  <button class="tbtn" id="editBtn" onclick="toggleEdit()">✏️ Sửa trang</button>
  <button class="tbtn" onclick="window.print()">🖨️ In / Xuất PDF</button>
</div>

<div class="container"><div id="app"><div class="empty" style="text-align:center;padding:60px 0">⏳ Đang tải…</div></div></div>
<div class="footer">LOHO House · Báo cáo TikTok Content · trang tự đọc số liệu từ Google Sheet</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   BÁO CÁO TUẦN TIKTOK — LOHO HOUSE (bản mới 04/08/2026)
   Cấu trúc sheet: cột A = LOẠI dòng · cột B = MÃ TUẦN (2026-08-1) · cột C trở đi = dữ liệu
   Các loại dòng: META KPI GMVVIDEO VIDEO CLIP QUAYSAU SANPHAM NHANXET KEHOACH TREND DUAN
   ═══════════════════════════════════════════════════════════════ */
const SHEET_ID = '1CHDLJAjR9UaQ5wPjkF9ZBMwGTU2ifuM_GT0LXGUkypM';
/* Sheet LỊCH CONTENT theo ngày (file quản lý content 10 tab) — trang tự đọc, lọc theo tuần đang xem */
const CONTENT_CSV_URL = 'https://docs.google.com/spreadsheets/d/1ASAWCqucmXOIBI-DjgXTdDiONOHEhOF1yG5hMKH0uxs/export?format=csv&gid=1170970805';

function sheetUrls(){
  const saved = localStorage.getItem('loho_csv_url');
  const fromQuery = new URLSearchParams(location.search).get('csv');
  const list = [];
  if (fromQuery) list.push(fromQuery);
  if (saved) list.push(saved);
  // PHẢI dùng /export?format=csv — KHÔNG dùng /gviz/tq (nó xoá chữ trong cột lẫn số).
  list.push('https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/export?format=csv');
  return list;
}

/* ── CSV parser (xử lý nháy kép + xuống dòng trong ô) ── */
function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else { if(c==='"') q=true;
      else if(c===','){ row.push(cell); cell=''; }
      else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
      else if(c!=='\r') cell+=c; }
  }
  if(cell!=='' || row.length){ row.push(cell); rows.push(row); }
  return rows;
}

/* ── tiện ích ── */
const esc = s => String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const cl  = s => String(s??'').trim();
const num = v => { const n=parseFloat(String(v??'').trim().replace(/\./g,'').replace(',','.')); return isNaN(n)?0:n; };
const fmtN = v => { const s=cl(v); return /^-?\d+$/.test(s) ? Number(s).toLocaleString('vi-VN') : s; };
const fmtMoney = v => { const n=num(v);
  if(n>=1e9)  return (n/1e9).toLocaleString('vi-VN',{maximumFractionDigits:2})+' tỷ';
  if(n>=1e6)  return (n/1e6).toLocaleString('vi-VN',{maximumFractionDigits:1})+'tr';
  if(n>=1e3)  return n.toLocaleString('vi-VN')+'đ';
  return n?n.toLocaleString('vi-VN')+'đ':'0đ'; };
const pctBadge = (cur,prev) => {
  if(prev===null||prev===undefined||!isFinite(prev)||prev===0) return '<span class="badge neu">— tuần đầu có số</span>';
  const p=(cur-prev)/Math.abs(prev)*100, s=p.toLocaleString('vi-VN',{maximumFractionDigits:1});
  if(p>0.05)  return '<span class="badge up">▲ +'+s+'%</span>';
  if(p<-0.05) return '<span class="badge down">▼ '+s+'%</span>';
  return '<span class="badge neu">— không đổi</span>'; };

const CLIP_ST = {DADANG:['dadang','✅ Đã đăng'],CHOEDIT:['choedit','🎬 Quay rồi – chờ edit'],
  CHUAQUAY:['chuaquay','📝 Có kịch bản – chưa quay'],YTUONG:['ytuong','💡 Mới có ý tưởng']};
const TREND_ST = {DAQUAY:['dadang','✅ Đã quay theo'],KICHBAN:['choedit','📝 Đang lên kịch bản'],BOQUA:['boqua','❌ Bỏ qua']};

/* ═══ TẢI DỮ LIỆU ═══ */
let ROWS=[], WEEKS=[], CUR=null, CURMONTH=null, DEMO=false;
let CONTENT=null, CONTENT_ERR=false; /* lịch content theo ngày — null = đang tải */

async function loadContent(){
  try{
    const r=await fetch(CONTENT_CSV_URL);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const t=await r.text();
    if(t.trim().startsWith('<')) throw new Error('Sheet chưa công khai');
    /* cột: 0 Mã · 1 Title · 2 Loại · 5 Lịch quay · 6 Deadline · 7 Ngày Air · 8 Người làm · 9 Đã quay · 10 Đã dựng · 11 Tiến độ · 12 Trạng thái */
    CONTENT=parseCSV(t).slice(1).filter(r2=>cl(r2[1]));
  }catch(e){ CONTENT_ERR=true; }
  if(CUR) renderWeek(CUR);
}

/* dd/mm[/yyyy] → Date (yyyy thiếu thì lấy năm fallback) */
function dmy(s,fbYear){
  const m=cl(s).match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?/);
  if(!m) return null;
  return new Date(+(m[3]||fbYear||new Date().getFullYear()), +m[2]-1, +m[1]);
}
/* khoảng ngày của tuần từ chuỗi range "27/07 – 02/08/2026" */
function weekSpan(wk){
  const ms=[...cl(wk.range).matchAll(/(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?/g)];
  if(ms.length<2) return null;
  const yEnd=+(ms[ms.length-1][3]||wk.y), yStart=+(ms[0][3]||yEnd);
  const a=new Date(yStart,+ms[0][2]-1,+ms[0][1]), b=new Date(yEnd,+ms[ms.length-1][2]-1,+ms[ms.length-1][1]);
  return a<=b?[a,b]:[new Date(yEnd-1,+ms[0][2]-1,+ms[0][1]),b]; /* tuần vắt qua năm */
}

async function load(){
  let text=null, lastErr=null;
  for(const u of sheetUrls()){
    try{
      const r=await fetch(u);
      if(!r.ok) throw new Error('HTTP '+r.status);
      const t=await r.text();
      if(t.trim().startsWith('<')) throw new Error('Sheet chưa công khai');
      text=t; break;
    }catch(e){ lastErr=e; }
  }
  loadContent(); /* lịch content tải song song, xong tự vẽ thêm */
  if(text===null){ boot(parseCSV(DEMO_CSV)); DEMO=true; note('⚠️ Không đọc được Google Sheet ('+esc(lastErr&&lastErr.message||'')+') — đang hiển thị <b>SỐ LIỆU MẪU</b>.'); return; }
  const rows=parseCSV(text);
  const ok=rows.some(r=>cl(r[0])==='META' && /^\d{4}-\d{1,2}-\d{1,2}$/.test(cl(r[1])));
  if(!ok){ boot(parseCSV(DEMO_CSV)); DEMO=true;
    note('⚠️ Sheet chưa có dữ liệu theo <b>cấu trúc mới</b> (cột B = mã tuần dạng 2026-08-1) — đang hiển thị <b>SỐ LIỆU MẪU</b>. Dán nội dung file <b>MAU-SHEET-BAO-CAO-MOI.csv</b> vào Sheet là chạy.');
    return; }
  boot(rows);
}
let NOTE='';
function note(html){ NOTE='<div class="banner">'+html+'</div>'; renderWeek(CUR); }

function boot(rows){
  ROWS=rows;
  WEEKS=rows.filter(r=>cl(r[0])==='META' && /^\d{4}-\d{1,2}-\d{1,2}$/.test(cl(r[1])))
    .map(r=>{ const m=cl(r[1]).match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      return {code:cl(r[1]), y:+m[1], m:+m[2], w:+m[3], range:cl(r[2]), updated:cl(r[3])}; })
    .sort((a,b)=>(a.y*10000+a.m*100+a.w)-(b.y*10000+b.m*100+b.w));
  if(!WEEKS.length){ document.getElementById('app').innerHTML='<div class="empty">Chưa có tuần nào trong Sheet.</div>'; return; }
  const last=WEEKS[WEEKS.length-1];
  CUR=last.code; CURMONTH=last.m;
  document.getElementById('filterbar').style.display='';
  document.getElementById('toolbar').style.display='';
  renderFilters(); renderWeek(CUR);
}

/* ═══ BỘ LỌC THÁNG → TUẦN ═══ */
function renderFilters(){
  const months=[...new Set(WEEKS.map(w=>w.m))];
  let mh='';
  for(let m=1;m<=12;m++){
    const has=months.includes(m);
    mh+='<button class="chip'+(m===CURMONTH?' on':'')+'" '+(has?'onclick="pickMonth('+m+')"':'disabled')+'>T'+m+'</button>';
  }
  document.getElementById('monthChips').innerHTML=mh;
  const wks=WEEKS.filter(w=>w.m===CURMONTH);
  document.getElementById('weekChips').innerHTML=wks.map(w=>
    '<button class="chip wk'+(w.code===CUR?' on':'')+'" onclick="pickWeek(\''+w.code+'\')">Tuần '+w.w+' <span class="small">('+esc(w.range||'')+')</span></button>'
  ).join('');
}
function pickMonth(m){ CURMONTH=m; const wks=WEEKS.filter(w=>w.m===m); CUR=wks[wks.length-1].code; renderFilters(); renderWeek(CUR); }
function pickWeek(c){ CUR=c; CURMONTH=WEEKS.find(w=>w.code===c).m; renderFilters(); renderWeek(c); }

/* ═══ RENDER 1 TUẦN ═══ */
const by=(t,c)=>ROWS.filter(r=>cl(r[0])===t && cl(r[1])===c);

function renderWeek(code){
  const wk=WEEKS.find(w=>w.code===code); if(!wk) return;
  const idx=WEEKS.indexOf(wk), prev=idx>0?WEEKS[idx-1]:null;
  document.getElementById('hsub').innerHTML=
    '更新時間 Cập nhật: <b>'+esc(wk.updated||'—')+'</b> · 本週 Tuần đang xem: <b>Tuần '+wk.w+' tháng '+wk.m+' ('+esc(wk.range)+')</b>';

  /* — bản đã sửa tay? — */
  const saved=localStorage.getItem('loho2_edit_'+code);
  if(saved && !editing){
    document.getElementById('app').innerHTML=
      '<div class="banner edited">✏️ Đang xem <b>bản đã sửa tay</b> của tuần này (chỉ hiện trên máy này).'+
      '<button onclick="resetEdit()">↺ Về số liệu gốc</button></div>'+saved;
    return;
  }

  const kpiR=(by('KPI',code)[0])||[];
  const kpiP=prev?((by('KPI',prev.code)[0])||[]):[];
  const gmvRows=by('GMVVIDEO',code), vidRows=by('VIDEO',code), clipRows=by('CLIP',code),
        quaySau=by('QUAYSAU',code), spRows=by('SANPHAM',code), nxRows=by('NHANXET',code),
        khRows=by('KEHOACH',code), trRows=by('TREND',code), duanRows=by('DUAN',code);

  let h=NOTE; NOTE='';

  /* ① KPI */
  const vidCount = cl(kpiR[5])!=='' ? kpiR[5] : String(vidRows.length||'');
  h+=sec('①','本週關鍵指標','KPI Tổng Quan Tuần','','so với tuần trước — trang tự tính');
  h+='<div class="kpis">'
    +kpiCard('影片GMV','GMV từ Video',fmtMoney(kpiR[2]),'',pctBadge(num(kpiR[2]),prev?num(kpiP[2]):null))
    +kpiCard('訂單','Đơn hàng từ video',fmtN(kpiR[3]),'món',pctBadge(num(kpiR[3]),prev?num(kpiP[3]):null))
    +kpiCard('觀看','Tổng lượt xem',fmtN(kpiR[4]),'',pctBadge(num(kpiR[4]),prev?num(kpiP[4]):null))
    +kpiCard('影片數','Video đã đăng',fmtN(vidCount),'video',pctBadge(num(vidCount),prev?num(cl(kpiP[5])!==''?kpiP[5]:by('VIDEO',prev.code).length):null))
    +kpiCard('粉絲','Follower tăng ròng',(num(kpiR[6])>0?'+':'')+fmtN(kpiR[6]),'người',pctBadge(num(kpiR[6]),prev?num(kpiP[6]):null))
    +'</div>';

  /* ② GMV video — ads vs organic */
  h+=sec('②','影片GMV來源','GMV Theo Video — Quảng Cáo vs Organic','⭐','video nào ra tiền · nguồn từ chạy quảng cáo hay organic');
  if(!gmvRows.length) h+=emptyMsg('GMVVIDEO');
  else{
    let ads=0,org=0;
    gmvRows.forEach(r=>{ (cl(r[4]).toUpperCase().startsWith('A')?ads+=num(r[3]):org+=num(r[3])); });
    const tot=ads+org, pAds=tot?Math.round(ads/tot*100):0, pOrg=tot?100-pAds:0;
    const maxG=Math.max(...gmvRows.map(r=>num(r[3])),1);
    h+='<div class="split"><div class="card donutwrap">'
      +'<div class="donut" style="background:conic-gradient(var(--red) 0 '+pAds+'%, var(--green) '+pAds+'% 100%)">'
      +'<div class="mid"><b>'+fmtMoney(tot)+'</b><span>tổng GMV video</span></div></div>'
      +'<div class="leg">'
      +'<div class="row"><span class="dot" style="background:var(--red)"></span>廣告 Quảng cáo <b>'+pAds+'% · '+fmtMoney(ads)+'</b></div>'
      +'<div class="row"><span class="dot" style="background:var(--green)"></span>自然 Organic <b>'+pOrg+'% · '+fmtMoney(org)+'</b></div>'
      +'</div></div>';
    h+='<div class="tblwrap"><table><tr><th>影片 Video</th><th class="r">GMV</th><th class="c">來源 Nguồn</th><th>評估 Đánh giá</th></tr>'
      +gmvRows.map(r=>{
        const isAds=cl(r[4]).toUpperCase().startsWith('A');
        return '<tr><td class="vidname">'+esc(r[2])
          +'<div class="bar"><i style="width:'+Math.round(num(r[3])/maxG*100)+'%"></i></div></td>'
          +'<td class="r"><b>'+fmtMoney(r[3])+'</b></td>'
          +'<td class="c"><span class="tag '+(isAds?'ads':'org')+'">'+(isAds?'🅐 Quảng cáo':'🅞 Organic')+'</span></td>'
          +'<td class="small">'+esc(r[5]||'')+'</td></tr>';
      }).join('')+'</table></div></div>';
  }

  /* ③ Video đã đăng */
  h+=sec('③','本週發布影片','Video Đã Đăng Trong Tuần','','tuần này đăng '+(vidRows.length||0)+' video');
  if(!vidRows.length) h+=emptyMsg('VIDEO');
  else{
    const groups={}; vidRows.forEach(r=>{ const g=cl(r[3])||'Khác'; groups[g]=(groups[g]||0)+1; });
    h+='<div class="secnote">Chủ đề: '+Object.entries(groups).map(([g,n])=>'<span class="tag">'+esc(g)+' × '+n+'</span>').join(' ')+'</div>';
    h+='<div class="tblwrap"><table><tr><th>影片 Video</th><th>主題 Chủ đề</th><th class="c">Ngày đăng</th><th class="r">👁️ Xem</th><th class="r">❤️ Thích</th><th class="r">💬 Bình luận</th><th class="r">↗️ Chia sẻ</th><th class="r">🔖 Lưu</th><th>評估 Đánh giá</th></tr>'
      +vidRows.map(r=>'<tr><td class="vidname">'+esc(r[2])+'</td><td><span class="tag">'+esc(r[3]||'—')+'</span></td>'
        +'<td class="c small">'+esc(r[4]||'')+'</td>'
        +'<td class="r"><b>'+fmtN(r[5])+'</b></td><td class="r">'+fmtN(r[6])+'</td><td class="r">'+fmtN(r[7])+'</td>'
        +'<td class="r">'+fmtN(r[8])+'</td><td class="r">'+fmtN(r[9])+'</td>'
        +'<td class="small">'+esc(r[10]||'')+'</td></tr>').join('')+'</table></div>';
  }

  /* ④ Tiến độ sản xuất */
  h+=sec('④','製作進度','Tiến Độ Sản Xuất (Quay – Dựng – Đăng)','','trạng thái từng clip + kế hoạch quay tuần sau');
  if(!clipRows.length && !quaySau.length) h+=emptyMsg('CLIP / QUAYSAU');
  else{
    const cnt={DADANG:0,CHOEDIT:0,CHUAQUAY:0,YTUONG:0};
    clipRows.forEach(r=>{ const s=cl(r[3]).toUpperCase(); if(cnt[s]!==undefined) cnt[s]++; });
    h+='<div class="pipestats">'
      +'<div class="pipestat"><b>'+clipRows.length+'</b><span>tổng clip theo dõi</span></div>'
      +'<div class="pipestat"><b>'+cnt.DADANG+'</b><span>✅ đã đăng</span></div>'
      +'<div class="pipestat"><b>'+cnt.CHOEDIT+'</b><span>🎬 chờ edit</span></div>'
      +'<div class="pipestat"><b>'+cnt.CHUAQUAY+'</b><span>📝 chưa quay</span></div>'
      +'<div class="pipestat"><b>'+cnt.YTUONG+'</b><span>💡 ý tưởng</span></div></div>';
    if(clipRows.length)
      h+='<div class="tblwrap"><table><tr><th>Clip</th><th class="c">狀態 Trạng thái</th><th>Ghi chú</th></tr>'
        +clipRows.map(r=>{ const s=CLIP_ST[cl(r[3]).toUpperCase()]||['ytuong',esc(r[3])];
          return '<tr><td class="vidname">'+esc(r[2])+'</td><td class="c"><span class="st '+s[0]+'">'+s[1]+'</span></td><td class="small">'+esc(r[4]||'')+'</td></tr>'; }).join('')
        +'</table></div>';
    if(quaySau.length)
      h+='<div class="bullets">'+quaySau.map(r=>'<div class="b"><span class="ic">🎥</span><div><b>Kế hoạch quay: '
        +esc(r[2])+'</b> — '+esc(r[3]||'')+' clip dự kiến. <span class="small">'+esc(r[4]||'')+'</span></div></div>').join('')+'</div>';
  }

  /* ④b Lịch content theo ngày — tự đọc từ Sheet LỊCH ĐĂNG, lọc theo tuần đang xem */
  h+='<div class="secnote" style="margin-top:16px">📅 <b>日曆 Lịch Content Theo Ngày</b> — trang tự đọc từ Sheet quản lý content, lọc đúng tuần đang xem</div>';
  if(CONTENT_ERR)
    h+='<div class="empty">Không đọc được Sheet lịch content — kiểm tra Sheet còn công khai không.</div>';
  else if(CONTENT===null)
    h+='<div class="empty">Đang tải lịch content…</div>';
  else{
    const span=weekSpan(wk);
    if(!span) h+='<div class="empty">Không đọc được khoảng ngày của tuần này (dòng META cột C cần dạng «27/07 – 02/08/2026»).</div>';
    else{
      const inWk=d=>d && d>=span[0] && d<=span[1];
      const rows=CONTENT.filter(r=>{
        if(cl(r[12]).toUpperCase().includes('HỦY')) return false;
        return inWk(dmy(r[7],wk.y)) || inWk(dmy(r[5],wk.y)) || inWk(dmy(r[6],wk.y));
      });
      if(!rows.length) h+='<div class="empty">Tuần này chưa có video nào trong lịch content.</div>';
      else{
        const P=s=>cl(s).toUpperCase();
        const aired=rows.filter(r=>inWk(dmy(r[7],wk.y)) && (P(r[11])==='DONE'||P(r[12])==='AIR')).length;
        const editing2=rows.filter(r=>P(r[11]).includes('EDIT')).length;
        const late=rows.filter(r=>P(r[11]).includes('TRỄ')).length;
        const notyet=rows.filter(r=>P(r[11]).includes('CHƯA')).length;
        h+='<div class="pipestats">'
          +'<div class="pipestat"><b>'+rows.length+'</b><span>📋 video trong tuần</span></div>'
          +'<div class="pipestat"><b>'+aired+'</b><span>✅ đã đăng (air)</span></div>'
          +'<div class="pipestat"><b>'+editing2+'</b><span>🎬 đang edit</span></div>'
          +'<div class="pipestat"><b>'+late+'</b><span>⏰ trễ deadline</span></div>'
          +'<div class="pipestat"><b>'+notyet+'</b><span>📝 chưa bắt đầu</span></div></div>';
        const badge=t=>{ const u=P(t);
          if(u==='DONE') return '<span class="st dadang">✅ Done</span>';
          if(u.includes('EDIT')) return '<span class="st choedit">🎬 '+esc(t)+'</span>';
          if(u.includes('TRỄ')) return '<span class="st chuaquay">⏰ '+esc(t)+'</span>';
          return '<span class="st ytuong">'+esc(t||'—')+'</span>'; };
        h+='<div class="tblwrap"><table><tr><th class="c">Ngày air</th><th>影片 Video</th><th>Loại</th><th>Người làm</th><th class="c">quay/dựng</th><th class="c">進度 Tiến độ</th><th class="c">Duyệt</th></tr>'
          +rows.slice().sort((a,b)=>(dmy(a[7],wk.y)||dmy(a[6],wk.y)||span[1])-(dmy(b[7],wk.y)||dmy(b[6],wk.y)||span[1]))
            .map(r=>'<tr><td class="c">'+esc(cl(r[7])?cl(r[7]).split('/').slice(0,2).join('/'):'—')
              +'</td><td class="vidname">'+esc(r[1])+(cl(r[0])?' <span class="small">('+esc(r[0])+')</span>':'')
              +'</td><td class="small">'+esc(r[2]||'—')+'</td><td class="small">'+esc(r[8]||'—')
              +'</td><td class="c small">'+(P(r[9])==='TRUE'?'🎥':'·')+' '+(P(r[10])==='TRUE'?'✂️':'·')
              +'</td><td class="c">'+badge(r[11])+'</td><td class="c small">'+esc(r[12]||'—')+'</td></tr>').join('')
          +'</table></div>';
      }
    }
  }

  /* ⑤ Top trong tuần */
  h+=sec('⑤','本週之最','Top Trong Tuần','','trang tự tìm từ bảng ② và ③');
  const bestGmv = gmvRows.length? gmvRows.reduce((a,b)=>num(b[3])>num(a[3])?b:a) : null;
  const bestView= vidRows.length? vidRows.reduce((a,b)=>num(b[5])>num(a[5])?b:a) : null;
  if(!bestGmv && !bestView && !spRows.length) h+=emptyMsg('SANPHAM');
  else{
    h+='<div class="tops">';
    if(bestGmv) h+='<div class="topcard"><div class="lb">🥇 影片GMV第一 · Video ra nhiều tiền nhất</div>'
      +'<div class="name">'+esc(bestGmv[2])+'</div><div class="num">'+fmtMoney(bestGmv[3])
      +' <span>· '+(cl(bestGmv[4]).toUpperCase().startsWith('A')?'từ quảng cáo':'organic')+'</span></div></div>';
    if(bestView) h+='<div class="topcard"><div class="lb">👁️ 觀看第一 · Video nhiều view nhất</div>'
      +'<div class="name">'+esc(bestView[2])+'</div><div class="num">'+fmtN(bestView[5])+' <span>lượt xem</span></div></div>';
    h+='</div>';
    if(spRows.length){
      h+='<div class="secnote" style="margin-top:16px">🏆 <b>熱銷產品 Sản phẩm bán chạy nhất từ video TikTok</b></div>'
        +'<div class="tblwrap"><table><tr><th class="c">#</th><th>產品 Sản phẩm</th><th class="r">Số món</th><th class="r">GMV</th></tr>'
        +spRows.map((r,i)=>'<tr><td class="c">'+(i<3?['🥇','🥈','🥉'][i]:(i+1))+'</td><td class="vidname">'+esc(r[2])
          +'</td><td class="r">'+fmtN(r[3])+'</td><td class="r"><b>'+fmtMoney(r[4])+'</b></td></tr>').join('')+'</table></div>';
    }
  }

  /* ⑥ Nhận xét */
  h+=sec('⑥','本週評估','Nhận Xét Tuần Này','','');
  h+= nxRows.length
    ? '<div class="bullets">'+nxRows.map(r=>{ const good=cl(r[2]).toUpperCase().startsWith('T');
        return '<div class="b"><span class="ic">'+(good?'✅':'⚠️')+'</span><div>'+esc(r[3])+'</div></div>'; }).join('')+'</div>'
    : emptyMsg('NHANXET');

  /* ⑦ Kế hoạch tuần tới */
  h+=sec('⑦','下週影片計畫','Kế Hoạch Video Tuần Tới','','video dự kiến · ngày đăng · gắn sale gì');
  h+= khRows.length
    ? '<div class="tblwrap"><table><tr><th>影片 Video dự kiến</th><th class="c">Ngày đăng</th><th>促銷 Gắn sale</th></tr>'
      +khRows.map(r=>'<tr><td class="vidname">'+esc(r[2])+'</td><td class="c">'+esc(r[3]||'—')
        +'</td><td>'+(cl(r[4])?'<span class="tag gold">🏷️ '+esc(r[4])+'</span>':'<span class="small">—</span>')+'</td></tr>').join('')+'</table></div>'
    : emptyMsg('KEHOACH');

  /* ⑧ Trend */
  h+=sec('⑧','本週趨勢','Trend TikTok Tuần Này','','trend gì đang hot · mình có quay theo không');
  h+= trRows.length
    ? '<div class="tblwrap"><table><tr><th>趨勢 Trend</th><th class="c">Có quay theo?</th><th>Ghi chú / lý do</th></tr>'
      +trRows.map(r=>{ const s=TREND_ST[cl(r[3]).toUpperCase()]||['ytuong',esc(r[3]||'—')];
        return '<tr><td class="vidname">'+esc(r[2])+'</td><td class="c"><span class="st '+s[0]+'">'+s[1]+'</span></td><td class="small">'+esc(r[4]||'')+'</td></tr>'; }).join('')+'</table></div>'
    : emptyMsg('TREND');

  /* ⑨ Dự án riêng — dropdown gom dự án của MỌI tuần, chọn mới hiện, kèm lịch sử các tuần trước */
  h+=sec('⑨','專案追蹤','Dự Án Riêng (chọn mới hiện)','⭐','dự án theo mùa — chọn trong ô dưới để xem chi tiết + lịch sử các tuần');
  const allDuan=ROWS.filter(r=>cl(r[0])==='DUAN').map(r=>r.map(cl));
  const projs=[...new Set(allDuan.map(r=>r[2]).filter(Boolean))];
  if(!projs.length) h+=emptyMsg('DUAN');
  else{
    h+='<div class="projbox"><select id="projSel" onchange="showProj(this.value)">'
      +'<option value="">— 選擇專案 Chọn dự án để xem —</option>'
      +projs.map(p=>'<option value="'+esc(p)+'">'+esc(p)+'</option>').join('')
      +'</select><div id="projBody"></div></div>';
    window.__duan=allDuan; window.__duanCode=code;
  }

  document.getElementById('app').innerHTML=h;
  if(window.__projKeep && projs && projs.includes(window.__projKeep)){
    const s=document.getElementById('projSel');
    if(s){ s.value=window.__projKeep; showProj(window.__projKeep); }
  }
  if(editing) enableEdit();
}

function sec(n,zh,vi,star,note){
  return '<div class="sec"><span class="num">'+n+'</span><h2><span class="zh">'+zh+'</span>'+vi+'</h2>'
    +(star?'<span class="star">'+star+' sếp nhấn mạnh</span>':'')+'</div>'
    +(note?'<div class="secnote">'+note+'</div>':'');
}
function kpiCard(zh,vi,val,unit,badge){
  return '<div class="kpi"><div class="lb"><span class="zh">'+zh+'</span> '+vi+'</div>'
    +'<div class="val">'+(val||'—')+(unit?' <span>'+unit+'</span>':'')+'</div>'+badge+'</div>';
}
function emptyMsg(t){ return '<div class="empty">— Chưa nhập dữ liệu mục này (dòng loại <b>'+t+'</b> trong Sheet) —</div>'; }

/* dự án riêng — mục quen thuộc có tên đẹp, mục lạ (từ khoá mới trong Sheet) tự thành khối riêng */
const PROJ_GROUPS={
  VIETTHEM:['✍️','本週新寫 Kịch bản viết thêm tuần này'],
  DUYET:   ['📩','審核 Gửi duyệt'],
  DIENVIEN:['🎭','演員 Đưa diễn viên'],
  DAQUAY:  ['✅','已拍 Tập đã quay'],
  CHUAQUAY:['📝','未拍 Tập chưa quay'],
  KHOKHAN: ['⚠️','困難 Khó khăn đang gặp'],
  BUOCTIEP:['➡️','下一步 Bước tiếp theo']};
function showProj(name){
  const box=document.getElementById('projBody');
  window.__projKeep=name||null;
  if(!name){ box.innerHTML=''; return; }
  const all=(window.__duan||[]).filter(r=>r[2]===name), code=window.__duanCode;
  const rows=all.filter(r=>r[1]===code);
  const get=k=>rows.filter(r=>r[3].toUpperCase()===k).map(r=>r[4]);
  const tiendo=get('TIENDO')[0]||'';
  const mm=tiendo.match(/(\d+)\s*\/\s*(\d+)/); const pc=mm?Math.round(+mm[1]/+mm[2]*100):null;
  const list=(title,ic,arr)=> arr.length?'<div class="projcell"><h4>'+title+'</h4><ul>'
    +arr.map(x=>'<li>'+ic+' '+esc(x)+'</li>').join('')+'</ul></div>':'';
  let h='';
  if(!rows.length)
    h+='<div class="empty">Tuần này chưa nhập dữ liệu cho dự án này — xem lịch sử các tuần bên dưới.</div>';
  else{
    h+='<div class="projgrid">'
      +'<div class="projcell full"><h4>進度 Tiến độ kịch bản</h4><div style="font-size:15px;font-weight:700;color:var(--brown)">'+esc(tiendo||'—')+'</div>'
      +(pc!==null?'<div class="progressbig"><i style="width:'+pc+'%"></i></div><div class="small" style="margin-top:4px">'+pc+'% hoàn thành</div>':'')+'</div>';
    for(const k in PROJ_GROUPS) h+=list(PROJ_GROUPS[k][1],PROJ_GROUPS[k][0],get(k));
    const known=['TIENDO'].concat(Object.keys(PROJ_GROUPS));
    [...new Set(rows.map(r=>r[3].toUpperCase()).filter(k=>k&&!known.includes(k)))]
      .forEach(k=>{ h+=list(esc(k),'📌',get(k)); });
    h+='</div>';
  }
  /* lịch sử các tuần khác của dự án này — bấm là nhảy sang tuần đó, vẫn giữ dự án đang chọn */
  const hist=WEEKS.filter(w=>w.code!==code && all.some(r=>r[1]===w.code));
  if(hist.length){
    h+='<div class="projcell full" style="margin-top:10px"><h4>歷史 Lịch sử các tuần</h4><div class="tblwrap"><table>'
      +'<tr><th>Tuần</th><th>Tiến độ ghi nhận</th><th class="c"></th></tr>'
      +hist.slice().reverse().map(w=>{
        const t=all.find(r=>r[1]===w.code && r[3].toUpperCase()==='TIENDO');
        const n=all.filter(r=>r[1]===w.code).length;
        return '<tr><td class="vidname">Tuần '+w.w+' T'+w.m+' <span class="small">('+esc(w.range||'')+')</span></td>'
          +'<td class="small">'+esc(t?t[4]:('('+n+' dòng dữ liệu)'))+'</td>'
          +'<td class="c"><button class="chip wk" onclick="pickWeek(\''+w.code+'\')">Xem tuần này →</button></td></tr>';
      }).join('')+'</table></div></div>';
  }
  box.innerHTML=h;
}

let editing=false, saveTimer=null;
function toggleEdit(){
  editing=!editing;
  document.getElementById('editBtn').classList.toggle('active',editing);
  document.getElementById('editBtn').textContent=editing?'💾 Xong — đang lưu tự động':'✏️ Sửa trang';
  if(editing) enableEdit(); else { disableEdit(); renderWeek(CUR); }
}
function enableEdit(){
  const app=document.getElementById('app');
  app.setAttribute('contenteditable','true');
  app.addEventListener('input',onEdit);
}
function onEdit(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    const app=document.getElementById('app');
    localStorage.setItem('loho2_edit_'+CUR, app.innerHTML);
  },400);
}
function disableEdit(){
  const app=document.getElementById('app');
  app.removeAttribute('contenteditable');
  app.removeEventListener('input',onEdit);
}
function resetEdit(){ localStorage.removeItem('loho2_edit_'+CUR); renderWeek(CUR); }
