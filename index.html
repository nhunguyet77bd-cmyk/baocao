<style>
:root{--bg:#F7F1E8;--surface:#FFFFFF;--border:#E8DCCB;--brown:#6B4A2F;--brown2:#3D2B1F;--accent:#C89B6C;

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Be Vietnam Pro',sans-serif;background:var(--bg);color:var(--text);font-size:14px}
.small{font-size:11.5px;color:var(--text2)}
.zh{color:var(--accent);font-weight:700;margin-right:6px}
header{background:linear-gradient(120deg,#2E1F14,#6B4A2F 70%,#8a6a45);color:#FFF6EA;padding:26px 16px;text-align:center}
header h1{font-size:24px;font-weight:800}
header h1 .gold{color:#E8C79B}
#hsub{margin-top:8px;font-size:13px;color:#E7D7C3}
#hsub b{color:#fff}
/* ── bộ lọc ── */
.filterbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 10px;text-align:center;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(61,43,31,.05)}
.mrow{display:flex;flex-wrap:nowrap;gap:6px;justify-content:center;overflow-x:auto;padding-bottom:4px}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--text2);border-radius:20px;padding:7px 13px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;flex:0 0 auto}
.chip:hover:not(:disabled){border-color:var(--accent);color:var(--brown)}
.chip.on{background:var(--brown2);border-color:var(--brown2);color:#FFF6EA}
.chip:disabled{opacity:.35;cursor:not-allowed}
/* lịch tháng */
.calwrap{max-width:300px;margin:10px auto 0;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px 9px}
.calhead{display:grid;grid-template-columns:26px repeat(7,1fr);gap:2px;font-size:9px;color:var(--text2);font-weight:700;margin-bottom:3px}
.calrow{display:grid;grid-template-columns:26px repeat(7,1fr);gap:2px;margin-bottom:2px}
.wkbtn{border:1px solid var(--border);background:#FBF6EE;border-radius:6px;font-size:8.5px;font-weight:700;color:var(--brown);cursor:pointer;font-family:inherit}
.wkbtn:hover{background:var(--accent);color:#fff}
.day{border:1px solid transparent;border-radius:6px;padding:3px 0;font-size:10.5px;cursor:pointer;position:relative;background:transparent;font-family:inherit;color:var(--text)}
.day:hover{border-color:var(--accent)}
.day.out{color:#CBBBA6;pointer-events:none}
.day.dot::after{content:'';position:absolute;left:50%;bottom:2px;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--accent)}
.day.inr{background:#F3E4CF}
.day.edge{background:var(--brown2);color:#FFF6EA;font-weight:700}
.calfoot{display:flex;gap:5px;justify-content:center;margin-top:6px;flex-wrap:wrap}
.calfoot .chip{font-size:10px;padding:4px 10px}
#rangeLabel{margin-top:10px;font-size:13px}
#rangeLabel b{color:var(--brown)}
.hint{font-size:10.5px;color:var(--text2);margin-top:5px}
/* nav 3 mục — tab ngang gọn, nằm trong thanh dính nên lướt xuống vẫn thấy */
.nav{display:flex;gap:6px;justify-content:center;flex-wrap:nowrap;overflow-x:auto;margin:10px auto 0;max-width:960px;padding:0 12px}
.nb{flex:0 0 auto;border:1.5px solid var(--border);background:var(--surface);border-radius:22px;padding:8px 16px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;white-space:nowrap}
.nb .ic{font-size:14px}
.nb .t{font-weight:700;font-size:12.5px;color:var(--brown)}
.nb.on{background:var(--brown2);border-color:var(--brown2)}
.nb.on .t{color:#FFF6EA}

main{max-width:960px;margin:0 auto;padding:18px 14px 60px}
.toolbar{display:flex;gap:8px;justify-content:flex-end;margin-bottom:10px}
.toolbar button{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:7px 14px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--brown);cursor:pointer}
.toolbar button.active{background:var(--goldbg);border-color:var(--gold)}
.banner{background:#FFF4D8;border:1px solid #E8C79B;border-radius:12px;padding:12px 16px;font-size:13px;margin-bottom:14px}
.banner button{margin-left:10px;border:1px solid var(--gold);background:#fff;border-radius:8px;padding:4px 10px;font-family:inherit;font-size:12px;cursor:pointer}
.sec{display:flex;align-items:center;gap:10px;margin:26px 0 4px;border-bottom:2px solid var(--accent);padding-bottom:8px}
.sec h2{font-size:17px;font-weight:800}
.sec .star{font-size:10.5px;background:var(--goldbg);color:var(--gold);border-radius:12px;padding:3px 10px;font-weight:700;white-space:nowrap}
.secnote{font-size:11.5px;color:var(--text2);margin:6px 0 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:14px 0}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px}
.kpi .lb{font-size:11px;color:var(--text2);font-weight:600}
.kpi .val{font-size:21px;font-weight:800;color:var(--brown);margin-top:4px}

.badge{display:inline-block;font-size:10.5px;font-weight:700;border-radius:10px;padding:2px 8px;margin-top:6px}
.badge.up{background:var(--goodbg);color:var(--good)}
.badge.dn{background:var(--badbg);color:var(--bad)}
.badge.fl{background:#F1EAE0;color:var(--text2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}

/* thanh ngang % (traffic / nhân khẩu) */
.hrow{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12.5px}
.hrow .hl{flex:0 0 110px}
.hrow .hv{flex:0 0 46px;text-align:right;font-weight:700;color:var(--brown)}
.hbar{flex:1;height:8px;background:#F1EAE0;border-radius:5px;overflow:hidden}
.hbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#a97e50);border-radius:5px}
/* thẻ mục tiêu */
.goal{background:linear-gradient(120deg,#FBF3DC,#FFF8EC);border:1.5px solid var(--gold);border-radius:14px;padding:14px 16px;margin:14px 0}

.bar{flex:1;background:linear-gradient(180deg,var(--accent),#a97e50);border-radius:4px 4px 0 0;position:relative;min-width:6px}
.bar .v{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;color:var(--brown);white-space:nowrap;margin-bottom:2px}
.bar:hover{opacity:.8}
.bar .tip{display:none;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--brown2);color:#fff;font-size:10px;border-radius:6px;padding:3px 7px;white-space:nowrap;margin-bottom:4px;z-index:5}

.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:14px;margin:10px 0}

.projbox select{width:100%;max-width:420px;font-family:inherit;font-size:14px;font-weight:600;color:var(--brown);padding:11px 14px;border:1.5px solid var(--accent);border-radius:12px;background:var(--surface);margin:10px 0}
.projgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.projgrid{grid-template-columns:1fr}}
.projcell{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px}
.projcell.full{grid-column:1/-1}
.projcell h4{font-size:11.5px;color:var(--text2);margin-bottom:7px}
.projcell ul{list-style:none}
.projcell li{font-size:12.5px;padding:4px 0}
.progressbig{height:10px;background:#F1EAE0;border-radius:6px;margin-top:8px;overflow:hidden}
.progressbig i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--good));border-radius:6px}
/* 2 team cạnh nhau để so sánh */
.teamwrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0;align-items:start}
@media(max-width:640px){.teamwrap{grid-template-columns:1fr}}
.teamcard{background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:14px;box-shadow:0 2px 8px rgba(107,74,47,.08)}
.tname{font-size:17px;font-weight:800;text-align:center;color:var(--brown);background:#FBF6EE;border:1px solid var(--accent);border-radius:10px;padding:9px;margin-bottom:12px}
.trow.em{background:var(--goldbg);border-radius:10px;padding:9px 10px;border-top:none;margin-top:8px}
.trow.em .tl{color:var(--gold)}
.trow.em li{font-weight:700}
.tick{color:var(--good);font-weight:800}
.tick.off{color:#C9BBA8;font-weight:600}
.trow{padding:8px 0;border-top:1px dashed var(--border);font-size:12.5px}
.trow:first-of-type{border-top:none}
.trow .no{display:inline-block;min-width:20px;font-weight:800;color:var(--accent)}
.trow .tl{font-weight:700;color:var(--text2);font-size:11px}
.trow ul{list-style:none;margin-top:3px}
.trow li{padding:2px 0 2px 22px}
.timeline{margin-top:14px}
.tl-day{display:flex;gap:12px;margin-bottom:10px}
.tl-date{flex:0 0 86px;font-size:11.5px;font-weight:700;color:var(--brown);padding-top:11px;text-align:right}
.tl-body{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 13px;font-size:12.5px}
.tl-body div{padding:2px 0}
footer{text-align:center;padding:24px;font-size:11px;color:var(--text2)}
@media print{
  .filterbar,.toolbar,.nav,.banner button,.hint{display:none!important}

}

function parseCSV(text){
  const rows=[]; let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }

  }
  if(cell!==''||row.length){ row.push(cell.replace(/\r$/,'')); rows.push(row); }

/* ═══════════ NẠP DỮ LIỆU ═══════════ */
function rowsToObjs(rows, map, reqKeys){
  /* reqKeys: dòng chỉ được nhận khi ít nhất 1 cột trong danh sách có dữ liệu — để bỏ qua các ô vàng mẫu chưa điền */
  const out=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i]; if(!r || !cl(r[0]) || !dmy(r[0])) continue;
    const o={d:dmy(r[0])};
    for(const k in map){ const c=map[k]; o[k] = c.n ? (cl(r[c.i])===''?null:num(r[c.i])) : cl(r[c.i]); }
    const keys=reqKeys||Object.keys(map);
    if(!keys.some(k=>o[k]!==null&&o[k]!==''&&o[k]!==undefined)) continue;
    out.push(o);
  }
  return out;
}
const MAPS = {
  tq:  {gmv:{i:1,n:1},ads:{i:2,n:1},chi:{i:3,n:1},don:{i:4,n:1},xem:{i:5,n:1},fol:{i:6,n:1},note:{i:7}},
  vid: {ten:{i:1},dang:{i:2},loai:{i:3},nguon:{i:4},gmv:{i:5,n:1},don:{i:6,n:1},xem:{i:7,n:1},tim:{i:8,n:1},bl:{i:9,n:1},cs:{i:10,n:1},luu:{i:11,n:1},dg:{i:12},chiAds:{i:13,n:1}},
  nx:  {loai:{i:1},nd:{i:2},ghi:{i:3},mon:{i:4,n:1},gmv:{i:5,n:1}}
};
/* DUAN dạng 2 cột song song: NGAY | DU_AN | MUC | GENZ | THANHBINH | CHUNG — mỗi dòng tách thành tối đa 3 bản ghi */
function parseDuan(rows){
  const out=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i]; if(!r||!dmy(cl(r[0]))) continue;
    const d=dmy(cl(r[0])), duAn=cl(r[1]), muc=cl(r[2]);
    if(!duAn||!muc) continue;
    if(cl(r[3])) out.push({d,duAn,team:'GENZ',muc,nd:cl(r[3])});
    if(cl(r[4])) out.push({d,duAn,team:'THANHBINH',muc,nd:cl(r[4])});
    if(cl(r[5])) out.push({d,duAn,team:'',muc,nd:cl(r[5])});
  }
  return out;
}
async function fetchTab(key,tab){
  const gid=GIDS[tab];
  if(gid===null||gid===undefined||gid===''){ DEMOTABS.push(tab); return parseCSV(DEMO[key]); }
  try{
    const r=await fetch(tabUrl(gid)+'&_cb='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw 0;
    const t=await r.text();
    if(t.trim().startsWith('<')) throw 0;
    return parseCSV(t);
  }catch(e){ DEMOTABS.push(tab); return parseCSV(DEMO[key]); }
}
async function loadContent(){
  try{
    const r=await fetch(CONTENT_CSV_URL+'&_cb='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw 0;
    const t=await r.text();
    if(t.trim().startsWith('<')) throw 0;
    const all2=parseCSV(t);
    /* dò vị trí cột theo TÊN TIÊU ĐỀ — team thêm/bớt cột trong lịch content thì trang vẫn đúng */
    const hd=(all2[0]||[]).map(x=>cl(x).toLowerCase());
    const find=(re,fb)=>{ const i=hd.findIndex(h=>re.test(h)); return i>=0?i:fb; };
    CI={ ma:find(/^mã|mã video/,0), ten:find(/title|tiêu đề|tên video/,1), loai:find(/loại/,2),
         lichquay:find(/lịch quay/,5), deadline:find(/deadline/,6), air:find(/ngày air|ngày đăng/,7),
         quay:find(/^đã quay/,9), dung:find(/^đã dựng/,10), ads:find(/ads|quảng cáo/,-1),
         tiendo:find(/tiến độ/,11), duyet:find(/trạng thái/,12) };
    CONTENT_ADS_COL=CI.ads;
    CONTENT=all2.slice(1).filter(x=>cl(x[CI.ten]));
  }catch(e){ CONTENT_ERR=true; }
  if(RA) render();
}
async function load(){
  const [tq,vid,duan,nx] = await Promise.all([
    fetchTab('tq','TONGQUAN'), fetchTab('vid','VIDEO'), fetchTab('duan','DUAN'), fetchTab('nx','NHANXET')
  ]);
  loadContent();
  const fix=r=>{ if(r.dang!==undefined) r.dang=dmy(r.dang); return r; };
  DB.tq=rowsToObjs(tq,MAPS.tq,['gmv','ads','chi','don','xem','fol']);
  DB.vid=rowsToObjs(vid,MAPS.vid,['ten']).map(fix);
  DB.duan=parseDuan(duan); DB.nx=rowsToObjs(nx,MAPS.nx,['nd']);
  const all=[...DB.tq,...DB.vid,...DB.duan,...DB.nx].map(o=>o.d).filter(Boolean);
  const maxD = all.length ? new Date(Math.max(...all.map(d=>d.getTime()))) : new Date(2026,6,27);
  /* mặc định: tuần (T2→CN) chứa ngày mới nhất có dữ liệu */
  const dow=(maxD.getDay()+6)%7;
  RA=addD(maxD,-dow); RB=addD(RA,6);
  CURMONTH=RA.getMonth()+1; CURYEAR=RA.getFullYear();
  document.getElementById('filterbar').style.display='';
  document.getElementById('navTabs').style.display='';
  document.getElementById('toolbar').style.display='';
  render();
}

/* ═══════════ LỌC THEO KHOẢNG NGÀY ═══════════ */
const inR=(d,a,b)=>d&&d>=a&&d<=b;
const rowsIn=(arr,a,b)=>arr.filter(o=>inR(o.d,a||RA,b||RB));
function prevRange(){ const len=Math.round((RB-RA)/864e5)+1; return [addD(RA,-len), addD(RA,-1)]; }
const sum=(arr,k)=>arr.reduce((t,o)=>t+(Number(o[k])||0),0);
function dataDates(){ const s=new Set(); [...DB.tq,...DB.vid,...DB.duan,...DB.nx].forEach(o=>o.d&&s.add(iso(o.d))); return s; }

function rangeLabel(){
  const days=Math.round((RB-RA)/864e5)+1;
  const mStart=new Date(RA.getFullYear(),RA.getMonth(),1), mEnd=new Date(RA.getFullYear(),RA.getMonth()+1,0);
  if(sameD(RA,mStart)&&sameD(RB,mEnd)) return ['Cả tháng '+(RA.getMonth()+1)+'/'+RA.getFullYear(),'BÁO CÁO THÁNG'];
  if(days===7 && (RA.getDay()+6)%7===0) return ['Tuần '+ddmm(RA)+' – '+ddmm(RB)+'/'+RB.getFullYear(),'BÁO CÁO TUẦN'];
  return [ddmm(RA)+'/'+RA.getFullYear()+' – '+ddmm(RB)+'/'+RB.getFullYear(),days+' NGÀY'];
}

/* ═══════════ BỘ LỌC: THÁNG 1 DÒNG + LỊCH ═══════════ */
function renderFilters(){
  const dset=dataDates();
  const monthsWith=new Set([...dset].map(s=>+s.slice(5,7)));
  let mh='';
  for(let m=1;m<=12;m++)
    mh+='<button class="chip'+(m===CURMONTH?' on':'')+'" onclick="pickMonth('+m+')">T'+m+'</button>';
  document.getElementById('monthChips').innerHTML=mh;

  /* lịch tháng — chỉ hiện khi calOpen */
  const box=document.getElementById('calBox');
  if(!calOpen){
    box.style.display='none';
    const [lb,kind]=rangeLabel();
    document.getElementById('rangeLabel').innerHTML='Đang xem: <b>'+lb+'</b> <span class="tag gold" style="margin-left:6px">'+kind+'</span>';
    document.getElementById('hsub').innerHTML='本期 Kỳ đang xem: <b>'+lb+'</b> · trang tự đọc Google Sheet + lịch content';
    return;
  }
  box.style.display='';
  const y=CURYEAR, m=CURMONTH-1;
  const first=new Date(y,m,1), last=new Date(y,m+1,0);
  const lead=(first.getDay()+6)%7;
  let cal='<div class="calhead"><span></span><span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span><span>CN</span></div>';
  let d=addD(first,-lead), wi=1;
  while(d<=last){
    const mon=d;
    cal+='<div class="calrow"><button class="wkbtn" onclick="pickWeekOf(\''+iso(mon)+'\')" title="Chọn nguyên tuần">T'+wi+'</button>';
    for(let i=0;i<7;i++){
      const out=d.getMonth()!==m;
      const cls=['day']; if(out)cls.push('out');
      if(dset.has(iso(d)))cls.push('dot');
      if(inR(d,RA,RB))cls.push('inr');
      if(sameD(d,RA)||sameD(d,RB))cls.push('edge');
      if(pickStart&&sameD(d,pickStart))cls.push('edge');
      cal+='<button class="'+cls.join(' ')+'" onclick="pickDay(\''+iso(d)+'\')">'+d.getDate()+'</button>';
      d=addD(d,1);
    }
    cal+='</div>'; wi++;
  }
  cal+='<div class="calfoot"><button class="chip" onclick="pickWholeMonth()">Cả tháng '+CURMONTH+'</button><button class="chip" onclick="pickLast7()">7 ngày dữ liệu mới nhất</button></div>';
  cal+='<div class="hint">Bấm nút <b>T«n»</b> đầu hàng chọn nguyên tuần · bấm <b>ngày đầu rồi ngày cuối</b> tự chọn khoảng · chấm nâu = ngày có dữ liệu</div>';
  box.innerHTML=cal;

  const [lb,kind]=rangeLabel();
  document.getElementById('rangeLabel').innerHTML='Đang xem: <b>'+lb+'</b> <span class="tag gold" style="margin-left:6px">'+kind+'</span>'+(pickStart?' · <span class="small">đã chọn ngày đầu <b>'+ddmm(pickStart)+'</b> — bấm ngày cuối</span>':'');
  document.getElementById('hsub').innerHTML='本期 Kỳ đang xem: <b>'+lb+'</b> · trang tự đọc Google Sheet + lịch content';
}
function pickMonth(m){
  if(m===CURMONTH && calOpen){ calOpen=false; renderFilters(); return; }  /* bấm lại chip đang mở = đóng lịch */
  CURMONTH=m; pickStart=null; calOpen=true;
  renderFilters();
}
function pickDay(s){
  const d=new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10));
  if(!pickStart){ pickStart=d; renderFilters(); return; }
  RA=pickStart<=d?pickStart:d; RB=pickStart<=d?d:pickStart; pickStart=null; calOpen=false; render();
}
function pickWeekOf(s){ const d=new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10)); RA=d; RB=addD(d,6); pickStart=null; calOpen=false; render(); }
function pickWholeMonth(){ RA=new Date(CURYEAR,CURMONTH-1,1); RB=new Date(CURYEAR,CURMONTH,0); pickStart=null; calOpen=false; render(); }
function pickLast7(){ const all=[...dataDates()].sort(); if(!all.length)return; const s=all[all.length-1]; RB=new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10)); RA=addD(RB,-6); CURMONTH=RB.getMonth()+1; pickStart=null; calOpen=false; render(); }

/* ═══════════ RENDER ═══════════ */
function pctBadge(cur,prev){
  if(prev==null||prev===0||cur==null) return '<span class="badge fl">— chưa có kỳ trước</span>';
  const p=(cur-prev)/Math.abs(prev)*100;
  if(Math.abs(p)<0.05) return '<span class="badge fl">= bằng kỳ trước</span>';
  return p>0?'<span class="badge up">▲ +'+p.toLocaleString('vi-VN',{maximumFractionDigits:1})+'% so kỳ trước</span>'
            :'<span class="badge dn">▼ '+p.toLocaleString('vi-VN',{maximumFractionDigits:1})+'% so kỳ trước</span>';
}
function kpi(zh,vi,val,badge){ return '<div class="kpi"><div class="lb"><span class="zh">'+zh+'</span>'+vi+'</div><div class="val">'+val+'</div>'+badge+'</div>'; }
function secTitle(zh,vi,star,note){ return '<div class="sec"><h2><span class="zh">'+zh+'</span>'+vi+'</h2>'+(star?'<span class="star">sếp nhấn mạnh</span>':'')+'</div>'+(note?'<div class="secnote">'+note+'</div>':''); }

}

    if(cl(mt.ghi)) h+='<ul>'+cl(mt.ghi).split('·').map(x=>'<li>• '+esc(x.trim())+'</li>').join('')+'</ul>';
    if(mt.mon!=null&&mt.mon>0) h+='<div class="progressbig" style="margin-top:8px"><i style="width:'+Math.min(100,mt.mon)+'%"></i></div><div class="small" style="margin-top:3px">'+mt.mon+'% tiến độ</div>';
    h+='</div>';
  }
  /* donut ads vs organic + hiệu quả ads/đơn */
  const pAds=gmv?Math.round(ads/gmv*100):0;
  const chi=sum(tq,'chi'), don=sum(tq,'don');
  const roas=chi?ads/chi:null, aov=don?gmv/don:null;
  h+='<div class="grid2"><div class="card"><h4>廣告 vs 自然 · GMV từ Quảng cáo vs Organic</h4>'
    +'<div class="donutrow"><div class="donut" style="background:conic-gradient(var(--bad) 0 '+pAds+'%, var(--good) '+pAds+'% 100%)"></div>'
    +'<div class="leg"><div><span class="sw" style="background:var(--bad)"></span><b>'+pAds+'%</b> Ads · '+fmtMoney(ads)+'</div>'
    +'<div><span class="sw" style="background:var(--good)"></span><b>'+(100-pAds)+'%</b> Organic · '+fmtMoney(org)+'</div>'
    +'<div class="small">'+(pAds<=30?'Kênh sống khoẻ bằng organic — nền tốt.':'Tỷ trọng ads đang cao — cần xem lại hiệu quả từng video ads.')+'</div></div></div></div>'
    +'<div class="card"><h4>廣告效益 · Hiệu Quả Quảng Cáo & Đơn Hàng</h4>'
    +'<div class="leg">'
    +'<div>Chi phí ads: <b>'+(chi?fmtMoney(chi):'—')+'</b>'+(chi?'':' <span class="small">(điền cột CHI_PHI_ADS trong Sheet TONGQUAN là có)</span>')+'</div>'
    +(roas!==null?'<div>ROAS: <b>'+roas.toLocaleString('vi-VN',{maximumFractionDigits:1})+'x</b> <span class="small">— 1đ ads thu về '+roas.toLocaleString('vi-VN',{maximumFractionDigits:1})+'đ GMV'+(roas>=3?' · ổn':' · hơi thấp, xem lại video ads')+'</span></div>':'')
    +'<div>Giá trị đơn trung bình: <b>'+(aov?fmtMoney(aov):'—')+'</b>'+(aov?' <span class="small">/ đơn</span>':'')+'</div>'
    +'<div>GMV / 1.000 lượt xem: <b>'+(sum(tq,'xem')?fmtMoney(gmv/sum(tq,'xem')*1000):'—')+'</b> <span class="small">— sức bán của mỗi nghìn view</span></div>'
    +'</div></div></div>';
  /* bar chart theo ngày */
  const days=[]; for(let d=new Date(RA);d<=RB;d=addD(d,1)) days.push(new Date(d));
  const byDay=days.map(d=>({d,v:sum(DB.tq.filter(o=>sameD(o.d,d)),'gmv')}));
  const mx=Math.max(...byDay.map(o=>o.v),1);
  h+='<div class="card" style="margin:12px 0"><h4>柱狀圖 GMV video theo ngày</h4><div class="chart">'
    +byDay.map(o=>'<div class="bar" style="height:'+Math.max(2,o.v/mx*100)+'%">'+(byDay.length<=10&&o.v?'<b class="v">'+fmtMoney(o.v)+'</b>':'')+'<span class="tip">'+ddmm(o.d)+' · '+fmtMoney(o.v)+'</span></div>').join('')
    +'</div><div class="xlabs">'+byDay.map((o,i)=>'<span>'+(days.length>14?(i%Math.ceil(days.length/10)===0?ddmm(o.d):''):ddmm(o.d))+'</span>').join('')+'</div></div>';
  /* nguồn truy cập + nhân khẩu học (Sheet NHANXET · LOAI = TRAFFIC / NHANKHAU · SO_MON = %) */
  const barRow=o=>'<div style="margin-bottom:7px"><div style="display:flex;justify-content:space-between;font-size:12px"><span>'+esc(o.nd)+'</span><b>'+(o.mon!=null?o.mon.toLocaleString('vi-VN',{maximumFractionDigits:1})+'%':'—')+'</b></div><div style="height:7px;background:#F1EAE0;border-radius:5px;margin-top:3px"><div style="height:100%;width:'+Math.min(100,o.mon||0)+'%;background:var(--accent);border-radius:5px"></div></div></div>';
  const trf=rowsIn(DB.nx).filter(o=>cl(o.loai).toUpperCase()==='TRAFFIC');
  const nk=rowsIn(DB.nx).filter(o=>cl(o.loai).toUpperCase()==='NHANKHAU');
  if(trf.length||nk.length){
    h+='<div class="grid2">';
    h+='<div class="card"><h4>流量來源 Nguồn Lưu Lượng Truy Cập</h4>'+(trf.length?trf.map(barRow).join(''):'<div class="small">Chưa nhập (LOAI = TRAFFIC)</div>')+'</div>';
    h+='<div class="card"><h4>受眾 Nhân Khẩu Học Người Xem</h4>'+(nk.length?nk.map(barRow).join(''):'<div class="small">Chưa nhập (LOAI = NHANKHAU)</div>')+'</div>';
    h+='</div>';
  }
  /* ── 1 · TOP 5 VIDEO XEM NHIỀU NHẤT TRONG TUẦN ── */
  const medal=i=>i+1;
  const topXem=vid.filter(v=>v.xem).sort((a,b)=>b.xem-a.xem).slice(0,5);
  if(topXem.length){
    h+='<div class="secnote"><b>1 · TOP 5 video được xem nhiều nhất trong tuần</b></div><div class="tblwrap"><table><tr><th class="c">#</th><th>Video</th><th class="c">Nguồn</th><th class="r">View</th><th class="r">Tim</th><th class="r">Bình luận</th><th class="r">Chia sẻ</th></tr>'
      +topXem.map((v,i)=>'<tr><td class="c">'+medal(i)+'</td><td class="vidname">'+esc(v.ten)+'</td><td class="c"><span class="tag '+(cl(v.nguon).toUpperCase().startsWith('A')?'ads">ADS':'org">ORG')+'</span></td><td class="r"><b>'+fmtN(v.xem)+'</b></td><td class="r">'+fmtN(v.tim)+'</td><td class="r">'+fmtN(v.bl)+'</td><td class="r">'+fmtN(v.cs)+'</td></tr>').join('')+'</table></div>';
  }
  /* ── 2 · TOP 5 VIDEO TẠO DOANH THU ── */
  const top5G=vid.filter(v=>v.gmv).sort((a,b)=>b.gmv-a.gmv).slice(0,5);
  if(top5G.length){
    h+='<div class="secnote"><b>2 · TOP 5 video tạo ra doanh thu</b> — số đơn, số tiền, view, nguồn</div><div class="tblwrap"><table><tr><th class="c">#</th><th>Video</th><th class="c">Nguồn</th><th class="r">Số tiền (GMV)</th><th class="r">Số đơn</th><th class="r">View</th><th class="c">Chuyển đổi</th></tr>'
      +top5G.map((v,i)=>'<tr><td class="c">'+medal(i)+'</td><td class="vidname">'+esc(v.ten)+'</td><td class="c"><span class="tag '+(cl(v.nguon).toUpperCase().startsWith('A')?'ads">ADS':'org">ORG')+'</span></td><td class="r"><b>'+fmtMoney(v.gmv)+'</b></td><td class="r">'+fmtN(v.don)+'</td><td class="r">'+fmtN(v.xem)+'</td><td class="c">'+(v.don&&v.xem?(v.don/v.xem*100).toLocaleString('vi-VN',{maximumFractionDigits:2})+'%':'—')+'</td></tr>').join('')+'</table></div>';
  }
  /* ── 3 · CLIP ĐANG CHẠY QUẢNG CÁO — kèm đánh giá tiền ads vs doanh thu ── */
  const adsV=vid.filter(v=>cl(v.nguon).toUpperCase().startsWith('A')).sort((a,b)=>(b.gmv||0)-(a.gmv||0));
  if(adsV.length){
    const gmvAds=sum(adsV,'gmv');
    h+='<div class="secnote"><b>3 · Clip đang chạy quảng cáo trong kỳ</b> — xếp theo GMV, clip đầu chạy tốt nhất</div>';
    if(chi) h+='<div class="bullets"><div class="b"><span class="ic">•</span><div>Tiền ads đã chi: <b>'+fmtMoney(chi)+'</b> · GMV từ clip ads: <b>'+fmtMoney(gmvAds)+'</b> → ROAS <b>'+(gmvAds/chi).toLocaleString('vi-VN',{maximumFractionDigits:1})+'x</b> '+(gmvAds/chi>=3?'<span class="tag org">HIỆU QUẢ</span>':'<span class="tag ads">THẤP — XEM LẠI</span>')+'</div></div></div>';
    else h+='<div class="secnote">Điền CHI_PHI_ADS ở Sheet TONGQUAN để trang tự tính ROAS (tiền ads vs doanh thu).</div>';
    const dgAds=(v,i)=>{ const conv=v.don&&v.xem?v.don/v.xem*100:null;
      const rc=v.chiAds&&v.gmv?v.gmv/v.chiAds:null;
      if(rc!==null){ if(rc<1.5) return '<span class="tag ads">ROAS '+rc.toLocaleString('vi-VN',{maximumFractionDigits:1})+'x — LỖ/THẤP, CÂN NHẮC TẮT</span>';
        if(rc>=3) return '<span class="tag org">ROAS '+rc.toLocaleString('vi-VN',{maximumFractionDigits:1})+'x — HIỆU QUẢ, DUY TRÌ</span>';
        return '<span class="tag gold">ROAS '+rc.toLocaleString('vi-VN',{maximumFractionDigits:1})+'x — THEO DÕI THÊM</span>'; }
      if(i===0) return '<span class="tag org">CHẠY TỐT NHẤT — DUY TRÌ</span>';
      if(conv!==null&&conv<0.5) return '<span class="tag ads">CHUYỂN ĐỔI THẤP — CÂN NHẮC TẮT</span>';
      if(conv!==null&&conv>=1) return '<span class="tag org">CHUYỂN ĐỔI TỐT</span>';
      return '<span class="tag gold">THEO DÕI THÊM</span>'; };
    h+='<div class="tblwrap"><table><tr><th class="c">#</th><th>Clip</th><th class="r">Chi ads</th><th class="r">GMV</th><th class="r">Đơn</th><th class="r">View</th><th class="c">Chuyển đổi</th><th class="c">Đánh giá</th></tr>'
      +adsV.map((v,i)=>'<tr><td class="c">'+(i+1)+'</td><td class="vidname">'+esc(v.ten)+'</td><td class="r">'+(v.chiAds?fmtMoney(v.chiAds):'—')+'</td><td class="r"><b>'+fmtMoney(v.gmv)+'</b></td><td class="r">'+fmtN(v.don)+'</td><td class="r">'+fmtN(v.xem)+'</td><td class="c">'+(v.don&&v.xem?(v.don/v.xem*100).toLocaleString('vi-VN',{maximumFractionDigits:2})+'%':'—')+'</td><td class="c">'+dgAds(v,i)+'</td></tr>').join('')+'</table></div>';
    if(!adsV.some(v=>v.chiAds)) h+='<div class="secnote">Muốn hiện tiền ads + ROAS từng clip: mở Sheet VIDEO, gõ tiêu đề <b>CHI_ADS</b> vào ô N1 (cột ngay sau DANH_GIA) rồi điền tiền ads vào cột đó cho các dòng clip ADS.</div>';
  }
  /* ── 4 & 5 · SẢN PHẨM BÁN CHẠY / BÁN CHẬM ── */
  const spAll=rowsIn(DB.nx).filter(o=>cl(o.loai).toUpperCase()==='SANPHAM');
  const sp=spAll.slice().sort((a,b)=>(b.gmv||0)-(a.gmv||0)).slice(0,5);
  if(sp.length){
    h+='<div class="secnote"><b>4 · TOP 5 sản phẩm bán chạy trong tuần</b></div><div class="tblwrap"><table><tr><th class="c">#</th><th>Sản phẩm</th><th class="r">Số lượng</th><th class="r">Tiền (GMV)</th></tr>'
      +sp.map((o,i)=>'<tr><td class="c">'+medal(i)+'</td><td class="vidname">'+esc(o.nd)+'</td><td class="r">'+fmtN(o.mon)+'</td><td class="r"><b>'+fmtMoney(o.gmv)+'</b></td></tr>').join('')+'</table></div>';
    /* bán chậm = các sản phẩm NGOÀI top bán chạy — chỉ hiện khi có đủ hơn 5 sản phẩm, tránh cảnh sản phẩm số 1 lại nằm trong bảng «bán chậm» */
    const conLai=spAll.filter(o=>!sp.includes(o));
    if(conLai.length){
      const cham=conLai.slice().sort((a,b)=>((a.mon??a.gmv)||0)-((b.mon??b.gmv)||0)).slice(0,5);
      h+='<div class="secnote"><b>5 · Sản phẩm bán chậm</b> — ngoài nhóm bán chạy · cần đẩy content hoặc xem lại</div><div class="tblwrap"><table><tr><th class="c">#</th><th>Sản phẩm</th><th class="r">Số lượng</th><th class="r">Tiền (GMV)</th></tr>'
        +cham.map((o,i)=>'<tr><td class="c">'+(i+1)+'</td><td class="vidname">'+esc(o.nd)+'</td><td class="r">'+fmtN(o.mon)+'</td><td class="r"><b>'+fmtMoney(o.gmv)+'</b></td></tr>').join('')+'</table></div>';
    } else h+='<div class="secnote">Chưa có bảng «bán chậm» — Sheet mới có '+spAll.length+' sản phẩm, tất cả đều nằm trong nhóm bán chạy. Điền thêm sản phẩm vào Sheet NHANXET (LOAI = SANPHAM) là bảng này tự hiện.</div>';
  }
  /* nhận xét — TRANG TỰ PHÂN TÍCH từ số liệu, cộng thêm dòng nhập tay nếu có */
  h+=secTitle('評估','Nhận Xét Trong Kỳ',0,'trang tự phân tích từ số liệu — dòng TOT/CHUA trong Sheet (nếu có) hiện thêm bên dưới');
  const auto=[];
  if(tqP.length&&gmvP){ const p=(gmv-gmvP)/gmvP*100;
    auto.push({g:p>=0,t:'GMV video đạt '+fmtMoney(gmv)+' — '+(p>=0?'tăng ':'giảm ')+Math.abs(p).toLocaleString('vi-VN',{maximumFractionDigits:1})+'% so với kỳ trước'}); }
  if(newV.length){ const gNew=sum(newV,'gmv');
    if(!gNew) auto.push({g:false,t:newV.length+' video mới đăng nhưng chưa video nào tạo doanh thu — GMV vẫn dựa vào kho video cũ'});
    else auto.push({g:true,t:newV.length+' video mới đã tạo '+fmtMoney(gNew)+' GMV ('+Math.round(gNew/Math.max(gmv,1)*100)+'% tổng)'}); }
  if(gmv) auto.push({g:pAds<=30,t:pAds<=30?'Organic chiếm '+(100-pAds)+'% GMV — kênh sống khoẻ không phụ thuộc quảng cáo':'Quảng cáo chiếm '+pAds+'% GMV — cần xem lại hiệu quả từng video ads'});
  const engAll=sum(vid,'xem')?((sum(vid,'tim')+sum(vid,'bl')+sum(vid,'cs'))/sum(vid,'xem')*100):0;
  if(engAll) auto.push({g:engAll>=2,t:'Tỷ lệ tương tác '+engAll.toLocaleString('vi-VN',{maximumFractionDigits:1})+'% — '+(engAll>=2?'ổn':'hơi thấp, cần hook và kêu gọi tương tác mạnh hơn')});
  const folS=sum(tq,'fol'); if(folS) auto.push({g:folS>0,t:'Follower '+(folS>0?'tăng ròng +':'giảm ')+fmtN(Math.abs(folS))+' trong kỳ'});
  const nxAll=rowsIn(DB.nx);
  const good=nxAll.filter(o=>cl(o.loai).toUpperCase()==='TOT'), bad=nxAll.filter(o=>cl(o.loai).toUpperCase()==='CHUA');
  /* gom nhóm: toàn bộ TỐT trước, rồi mới tới CHƯA */
  const listTot=auto.filter(o=>o.g).map(o=>o.t).concat(good.map(o=>o.nd));
  const listChua=auto.filter(o=>!o.g).map(o=>o.t).concat(bad.map(o=>o.nd));
  if(listTot.length||listChua.length){
    h+='<div class="bullets">'
      +listTot.map(t=>'<div class="b"><span class="ic"><span class="tag org">TỐT</span></span><div>'+esc(t)+'</div></div>').join('')
      +listChua.map(t=>'<div class="b"><span class="ic"><span class="tag ads">CHƯA</span></span><div>'+esc(t)+'</div></div>').join('')+'</div>';
  } else h+=emptyMsg('Chưa đủ số liệu để phân tích.');
  return h;
}

/* ── ② VIDEO ── */
function renderS2(){
  const [pa,pb]=prevRange();
  const vid=rowsIn(DB.vid), vidP=rowsIn(DB.vid,pa,pb);
  const newV=vid.filter(v=>inR(v.dang,RA,RB)), newVP=vidP.filter(v=>inR(v.dang,pa,pb));
  const S=(a,k)=>sum(a,k);
  const eng=S(vid,'xem')?((S(vid,'tim')+S(vid,'bl')+S(vid,'cs'))/S(vid,'xem')*100):0;
  let h=secTitle('影片表現','Video Trong Kỳ',0,'video đăng trong kỳ · tương tác · mọi số đều so % với kỳ liền trước');
  h+='<div class="kpis">'
    +kpi('新影片','Video đăng',fmtN(newV.length),pctBadge(newV.length,vidP.length?newVP.length:null))
    +kpi('觀看','Lượt xem',fmtN(S(vid,'xem')||null),pctBadge(S(vid,'xem'),vidP.length?S(vidP,'xem'):null))
    +kpi('愛心','Tim',fmtN(S(vid,'tim')||null),pctBadge(S(vid,'tim'),vidP.length?S(vidP,'tim'):null))
    +kpi('留言','Bình luận',fmtN(S(vid,'bl')||null),pctBadge(S(vid,'bl'),vidP.length?S(vidP,'bl'):null))
    +kpi('分享','Chia sẻ',fmtN(S(vid,'cs')||null),pctBadge(S(vid,'cs'),vidP.length?S(vidP,'cs'):null))
    +kpi('收藏','Lượt lưu',fmtN(S(vid,'luu')||null),pctBadge(S(vid,'luu'),vidP.length?S(vidP,'luu'):null))
    +kpi('互動率','Tỷ lệ tương tác',eng?eng.toLocaleString('vi-VN',{maximumFractionDigits:1})+'<span>%</span>':'—','<span class="badge fl">(tim+bl+chia sẻ)/view</span>')
    +'</div>';
  /* bảng video mới */
  /* tự đánh giá video khi cột đánh giá bỏ trống */
  const avgV=newV.length?sum(newV,'xem')/newV.length:0;
  const autoDg=v=>{
    if(cl(v.dg)) return esc(v.dg);
    const parts=[];
    if(v.xem&&avgV) parts.push(v.xem>=avgV*1.4?'Tốt — view vượt trung bình tuần':(v.xem<=avgV*0.6?'Yếu view':'View mức trung bình'));
    const e=v.xem?(((v.tim||0)+(v.bl||0)+(v.cs||0))/v.xem*100):0;
    if(e) parts.push('tương tác '+(e>=3?'tốt':(e>=1.5?'ổn':'thấp')));
    if(v.xem&&v.don) parts.push('chuyển đổi '+(v.don/v.xem*100).toLocaleString('vi-VN',{maximumFractionDigits:2})+'%');
    return parts.length?esc(parts.join(' · '))+' <span class="small">(tự đánh giá)</span>':'';
  };
  h+='<div class="secnote"><b>Video đăng trong kỳ</b> — cột đánh giá bỏ trống thì trang tự nhận xét</div>';
  h+= newV.length
    ? '<div class="tblwrap"><table><tr><th class="c">Ngày</th><th>Video</th><th>Loại</th><th class="r">View</th><th class="r">Tim</th><th class="r">BL</th><th class="r">Share</th><th class="r">Lưu</th><th>Đánh giá</th></tr>'
      +newV.sort((a,b)=>a.dang-b.dang).map(v=>'<tr><td class="c">'+ddmm(v.dang)+'</td><td class="vidname">'+esc(v.ten)+'</td><td class="small">'+esc(v.loai||'—')+'</td><td class="r">'+fmtN(v.xem)+'</td><td class="r">'+fmtN(v.tim)+'</td><td class="r">'+fmtN(v.bl)+'</td><td class="r">'+fmtN(v.cs)+'</td><td class="r">'+fmtN(v.luu)+'</td><td class="small">'+autoDg(v)+'</td></tr>').join('')+'</table></div>'
    : emptyMsg('Kỳ này chưa có video mới trong Sheet VIDEO.');
  /* video cũ vẫn ra tiền */
  const oldG=vid.filter(v=>v.gmv&&!inR(v.dang,RA,RB)).sort((a,b)=>b.gmv-a.gmv);
  if(oldG.length){
    h+='<div class="secnote"><b>Video cũ vẫn ra tiền trong kỳ</b></div><div class="tblwrap"><table><tr><th>Video</th><th class="c">Nguồn</th><th class="r">GMV</th><th class="r">Đơn</th><th>Đánh giá</th></tr>'
      +oldG.map(v=>'<tr><td class="vidname">'+esc(v.ten)+'</td><td class="c"><span class="tag '+(cl(v.nguon).toUpperCase().startsWith('A')?'ads">ADS':'org">ORG')+'</span></td><td class="r"><b>'+fmtMoney(v.gmv)+'</b></td><td class="r">'+fmtN(v.don)+'</td><td class="small">'+(cl(v.dg)?esc(v.dg):(v.xem&&v.don?'chuyển đổi '+(v.don/v.xem*100).toLocaleString('vi-VN',{maximumFractionDigits:2})+'% <span class="small">(tự đánh giá)</span>':''))+'</td></tr>').join('')+'</table></div>';
  }
  /* lịch content — CHỈ trong khoảng thời gian đang lọc */
  h+='<div class="secnote"><b>日曆 Lịch Content Cả Tháng</b> — tự đọc từ Sheet quản lý content, team cập nhật gì là trang thấy liền</div>';
  h+=contentBlock(RA,RB,'Tháng này chưa có video nào trong lịch content.');
  /* kế hoạch & trend tuần tới */
  const nxAll=rowsIn(DB.nx);
  const nxA2=addD(RB,1), nxB2=addD(RB,7);
  h+=secTitle('下期計畫','Kế Hoạch Video Tuần Tới',0,'tuần tới ('+ddmm(nxA2)+' – '+ddmm(nxB2)+') sẽ up gì — trang tự lấy từ lịch content · muốn thêm ngoài lịch thì nhập LOAI = KEHOACH');
  if(CONTENT_ERR||CONTENT===null) h+=emptyMsg('Chưa đọc được lịch content.');
  else{
    const P2=s=>cl(s).toUpperCase(); const fy2=nxA2.getFullYear();
    const pd2=s=>{ const m=cl(s).match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?/); return m?new Date(+(m[3]||fy2),+m[2]-1,+m[1]):null; };
    const nwk=CONTENT.filter(r=>!P2(r[CI.duyet]).includes('HỦY')&&inR(pd2(r[CI.air]),nxA2,nxB2))
      .sort((a,b)=>pd2(a[CI.air])-pd2(b[CI.air]));
    if(nwk.length){
      h+='<div class="bullets"><div class="b"><span class="ic">•</span><div>Tuần tới dự kiến up <b>'+nwk.length+' video</b></div></div></div>';
      h+='<div class="tblwrap"><table><tr><th class="c">Ngày đăng</th><th>Video</th><th>Loại</th><th class="c">Tiến độ hiện tại</th><th class="c">Duyệt</th></tr>'
        +nwk.map(r=>'<tr><td class="c">'+cl(r[CI.air]).split('/').slice(0,2).join('/')+'</td><td class="vidname">'+esc(r[CI.ten])+(cl(r[CI.ma])?' <span class="small">('+esc(r[CI.ma])+')</span>':'')+'</td><td class="small">'+esc(r[CI.loai]||'—')+'</td><td class="c"><span class="st '+(P2(r[CI.tiendo])==='DONE'?'dadang">Done':(P2(r[CI.tiendo]).includes('EDIT')?'choedit">'+esc(r[CI.tiendo]):'ytuong">'+esc(r[CI.tiendo]||'—')))+'</span></td><td class="c small">'+esc(r[CI.duyet]||'—')+'</td></tr>').join('')+'</table></div>';
    } else h+=emptyMsg('Lịch content chưa có video nào cho tuần tới — cần lên lịch thêm.');
  }
  const kh=nxAll.filter(o=>cl(o.loai).toUpperCase()==='KEHOACH');
  if(kh.length){
    h+='<div class="secnote"><b>Kế hoạch bổ sung bạn nhập</b> (ngoài lịch content)</div><div class="bullets">'
      +kh.map(o=>'<div class="b"><span class="ic">•</span><div><b>'+esc(o.nd)+'</b>'+(o.ghi?' — <span class="small">'+esc(o.ghi)+'</span>':'')+'</div></div>').join('')+'</div>';
  }
  h+=secTitle('趨勢','Trend Tuần Này',0,'trend gì đang hot · mình xử lý thế nào · LOAI = TREND');
  const tr=nxAll.filter(o=>cl(o.loai).toUpperCase()==='TREND');
  h+= tr.length
    ? '<div class="bullets">'+tr.map(o=>'<div class="b"><span class="ic">•</span><div><b>'+esc(o.nd)+'</b>'+(o.ghi?' — <span class="small">'+esc(o.ghi)+'</span>':'')+'</div></div>').join('')+'</div>'
    : emptyMsg('Chưa ghi trend (LOAI = TREND).');
  return h;
}
function contentBlock(a,b,emptyText){
  if(CONTENT_ERR) return emptyMsg('Không đọc được Sheet lịch content — kiểm tra Sheet còn công khai không.');
  if(CONTENT===null) return emptyMsg('Đang tải lịch content…');
  const P=s=>cl(s).toUpperCase();
  const fy=a.getFullYear();
  const pd=s=>{ const m=cl(s).match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?/); return m?new Date(+(m[3]||fy),+m[2]-1,+m[1]):null; };
  /* hiện NGUYÊN THÁNG chứa kỳ đang xem; kỳ đang xem tô be, tuần kế tiếp tô vàng */
  const mA=new Date(a.getFullYear(),a.getMonth(),1), mB=new Date(b.getFullYear(),b.getMonth()+1,0);
  const nxA=addD(b,1), nxB=addD(b,7);
  const dOf=r=>pd(r[CI.air])||pd(r[CI.deadline])||pd(r[CI.lichquay]);
  const rows=CONTENT.filter(r=>{
    if(P(r[CI.duyet]).includes('HỦY')) return false;
    const d=dOf(r); return inR(d,mA,mB)||inR(d,nxA,nxB);
  });
  if(!rows.length) return emptyMsg(emptyText);
  const cur=rows.filter(r=>inR(dOf(r),a,b));
  const aired=cur.filter(r=>P(r[CI.tiendo])==='DONE'||P(r[CI.duyet])==='AIR').length;
  const editing2=cur.filter(r=>P(r[CI.tiendo]).includes('EDIT')).length;
  const late=cur.filter(r=>P(r[CI.tiendo]).includes('TRỄ')).length;
  const notyet=cur.filter(r=>P(r[CI.tiendo]).includes('CHƯA')).length;
  let h='<div class="pipestats"><div class="pipestat"><b>'+cur.length+'</b><span>video kỳ này</span></div>'
    +'<div class="pipestat"><b>'+aired+'</b><span>đã đăng (air)</span></div>'
    +'<div class="pipestat"><b>'+editing2+'</b><span>đang edit</span></div>'
    +'<div class="pipestat"><b>'+late+'</b><span>trễ deadline</span></div>'
    +'<div class="pipestat"><b>'+notyet+'</b><span>chưa bắt đầu</span></div></div>';
  h+='<div class="secnote"><span style="background:#F3E4CF;padding:2px 8px;border-radius:6px">nền be = kỳ đang xem ('+ddmm(a)+' – '+ddmm(b)+')</span> · <span style="background:#FFF1BF;padding:2px 8px;border-radius:6px">nền vàng = tuần kế tiếp ('+ddmm(nxA)+' – '+ddmm(nxB)+')</span> · còn lại = các tuần khác trong tháng</div>';
  const badge=t=>{ const u=P(t);
    if(u==='DONE') return '<span class="st dadang">Done</span>';
    if(u.includes('EDIT')) return '<span class="st choedit">'+esc(t)+'</span>';
    if(u.includes('TRỄ')) return '<span class="st chuaquay">'+esc(t)+'</span>';
    return '<span class="st ytuong">'+esc(t||'—')+'</span>'; };
  /* cột Chạy ads: ưu tiên giá trị team ghi trong sheet content; chưa có thì trang tự gợi ý theo Loại clip */
  const adsGoiY=loai=>{ const u=cl(loai).toUpperCase();
    if(/HƯỚNG DẪN|EDUCATE|MẸO/.test(u)) return '<span class="tag org">RẤT HỢP</span>';
    if(/SALE/.test(u)) return '<span class="tag org">HỢP — đẩy trước sale</span>';
    if(/BÁN HÀNG|SẢN PHẨM|THƯƠNG MẠI|SERIES/.test(u)) return '<span class="tag org">HỢP</span>';
    if(/GIẢI TRÍ|ĐỜI SỐNG|BRANDING/.test(u)) return '<span class="tag gold">TUỲ — có SP mới chạy</span>';
    return '<span class="small">—</span>'; };
  h+='<div class="tblwrap"><table><tr><th class="c">Ngày air</th><th>Video</th><th>Loại</th><th class="c">quay/dựng</th><th class="c">Tiến độ</th><th class="c">Duyệt</th><th class="c">Chạy ads?</th></tr>'
    +rows.slice().sort((x,y)=>(dOf(x)||mB)-(dOf(y)||mB))
      .map(r=>{ const d=dOf(r); const cls=inR(d,a,b)?' class="hl1"':(inR(d,nxA,nxB)?' class="hl2"':'');
        const userAds=CONTENT_ADS_COL>=0?cl(r[CONTENT_ADS_COL]):'';
        const adsC='<td class="c">'+(userAds?'<span class="tag ads">'+esc(userAds)+'</span>':adsGoiY(r[CI.loai]))+'</td>';
        return '<tr'+cls+'><td class="c">'+(cl(r[CI.air])?cl(r[CI.air]).split('/').slice(0,2).join('/'):'—')+'</td><td class="vidname">'+esc(r[CI.ten])+(cl(r[CI.ma])?' <span class="small">('+esc(r[CI.ma])+')</span>':'')+'</td><td class="small">'+esc(r[CI.loai]||'—')+'</td><td class="c small">'+(P(r[CI.quay])==='TRUE'?'<span class="tick">✓</span>':'<span class="tick off">–</span>')+' / '+(P(r[CI.dung])==='TRUE'?'<span class="tick">✓</span>':'<span class="tick off">–</span>')+'</td><td class="c">'+badge(r[CI.tiendo])+'</td><td class="c small">'+esc(r[CI.duyet]||'—')+'</td>'+adsC+'</tr>'; }).join('')+'</table></div>';
  return h;
}

/* ── ③ DỰ ÁN ── */
const PROJ_GROUPS={
  KICHBAN:'劇本 Kịch bản',
  VIETTHEM:'本週新寫 Kịch bản viết thêm',
  DUYET:'審核 Gửi duyệt',
  DIENVIEN:'演員 Đưa diễn viên',
  DAQUAY:'已拍 Đã quay',
  HOANCHINH:'完成 Video hoàn chỉnh',
  CHUAQUAY:'未拍 Chưa quay',
  KHOKHAN:'困難 Khó khăn',
  BUOCTIEP:'下一步 Bước tiếp theo',
  NHANXET:'評估 Nhận xét',
  KEHOACH:'下週計畫 Kế hoạch tuần sau',
  GHICHU:'備註 Ghi chú'};
function renderS3(){
  let h=secTitle('專案追蹤','Dự Án Riêng',0,'chọn dự án trong ô dưới mới hiện chi tiết · hai team hiển thị song song để so sánh');
  const projs=[...new Set(DB.duan.map(o=>o.duAn).filter(Boolean))];
  if(!projs.length) return h+emptyMsg('Chưa có dự án nào trong Sheet DUAN.');
  h+='<div class="projbox"><select id="projSel" onchange="showProj(this.value)"><option value="">— 選擇專案 Chọn dự án để xem —</option>'
    +projs.map(p=>'<option value="'+esc(p)+'">'+esc(p)+'</option>').join('')+'</select><div id="projBody"></div></div>';
  return h;
}
const TEAM_LABEL=t=>{ const u=cl(t).toUpperCase(); if(u==='GENZ')return'Team GENZ'; if(u==='THANHBINH')return'Team THANH BÌNH'; return u?'Team '+cl(t):''; };
function teamBlock(rows,titleHtml){
  const get=k=>rows.filter(o=>cl(o.muc).toUpperCase()===k).map(o=>o.nd);
  const tiendo=get('TIENDO')[0]||'';
  const mm=tiendo.match(/(\d+)\s*\/\s*(\d+)/); const pc=mm?Math.round(+mm[1]/+mm[2]*100):null;
  const list=(title,arr)=>arr.length?'<div class="projcell"><h4>'+title+'</h4><ul>'+arr.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>':'';
  let h=titleHtml;
  h+='<div class="projgrid">';
  if(tiendo) h+='<div class="projcell full"><h4>進度 Tiến độ</h4><div style="font-size:15px;font-weight:700;color:var(--brown)">'+esc(tiendo)+'</div>'
    +(pc!==null?'<div class="progressbig"><i style="width:'+pc+'%"></i></div><div class="small" style="margin-top:4px">'+pc+'% hoàn thành</div>':'')+'</div>';
  for(const k in PROJ_GROUPS) h+=list(PROJ_GROUPS[k],get(k));
  const known=['TIENDO'].concat(Object.keys(PROJ_GROUPS));
  [...new Set(rows.map(o=>cl(o.muc).toUpperCase()).filter(k=>k&&!known.includes(k)))].forEach(k=>{h+=list(esc(k),get(k));});
  h+='</div>';
  return h;
}
function showProj(name){
  const box=document.getElementById('projBody');
  window.__projKeep=name||null;
  if(!name){ box.innerHTML=''; return; }
  const all=DB.duan.filter(o=>o.duAn===name);
  const rows=all.filter(o=>inR(o.d,RA,RB));
  let h='';
  if(!rows.length) h+=emptyMsg('Kỳ đang xem chưa có ghi chép cho dự án này — chọn tuần khác trên lịch để xem lại các kỳ trước.');
  else{
    const named=[...new Set(rows.filter(o=>cl(o.team)).map(o=>cl(o.team).toUpperCase()))].sort();
    const chung=rows.filter(o=>!cl(o.team));
    if(named.length){
      /* danh sách MỤC chung cho mọi team — đánh số giống nhau để so sánh trái phải */
      const order=['TIENDO'].concat(Object.keys(PROJ_GROUPS));
      const used=[...new Set(rows.filter(o=>cl(o.team)).map(o=>cl(o.muc).toUpperCase()))];
      const fields=order.filter(k=>used.includes(k)).concat(used.filter(k=>!order.includes(k)));
      h+='<div class="teamwrap">'+named.map(t=>{
        const trs=rows.filter(o=>cl(o.team).toUpperCase()===t);
        const get=k=>trs.filter(o=>cl(o.muc).toUpperCase()===k).map(o=>o.nd);
        let c='<div class="teamcard"><div class="tname">'+esc(TEAM_LABEL(t))+'</div>';
        fields.forEach((k,i)=>{
          const g=PROJ_GROUPS[k]; const vals=get(k);
          const lbl=k==='TIENDO'?'進度 Tiến độ':(g||k);
          const em=(k==='NHANXET'||k==='KEHOACH')?' em':'';
          c+='<div class="trow'+em+'"><span class="no">'+(i+1)+'.</span><span class="tl">'+esc(lbl)+'</span>';
          if(!vals.length) c+='<ul><li class="small">—</li></ul>';
          else{
            c+='<ul>'+vals.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
            if(k==='TIENDO'){ const mm=vals[0].match(/(\d+)\s*\/\s*(\d+)/);
              if(mm){ const pc=Math.round(+mm[1]/+mm[2]*100);
                c+='<div class="progressbig"><i style="width:'+pc+'%"></i></div><div class="small" style="margin-top:3px">'+pc+'% hoàn thành</div>'; } }
          }
          c+='</div>';
        });
        return c+'</div>';
      }).join('')+'</div>';
    }
    if(chung.length) h+=teamBlock(chung,'<div class="secnote" style="margin-top:10px;font-size:13px"><b>Chung cả dự án</b></div>');
  }
  box.innerHTML=h;
}

/* ═══════════ SỬA TRANG ═══════════ */
function toggleEdit(){
  editing=!editing;
  document.getElementById('editBtn').classList.toggle('active',editing);
  document.getElementById('editBtn').textContent=editing?'Xong — đang lưu tự động':'Sửa trang';
  if(editing) enableEdit(); else { disableEdit(); render(); }
}
function enableEdit(){ const a=document.getElementById('app'); a.setAttribute('contenteditable','true'); a.addEventListener('input',onEdit); }
function onEdit(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>{ localStorage.setItem('loho4_edit_'+SEC+'_'+iso(RA)+'_'+iso(RB), document.getElementById('app').innerHTML); },400); }
function disableEdit(){ const a=document.getElementById('app'); a.removeAttribute('contenteditable'); a.removeEventListener('input',onEdit); }
function resetEdit(){ localStorage.removeItem('loho4_edit_'+SEC+'_'+iso(RA)+'_'+iso(RB)); render(); }

load();
</script>
